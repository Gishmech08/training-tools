<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel 101 Live Demo Hub</title>
<style>
:root{
  --navy:#0b3554;
  --blue:#2b8fbf;
  --blue2:#eaf5fb;
  --orange:#ef7f23;
  --green:#217346;
  --green2:#e8f3ed;
  --line:#d8e0e6;
  --soft:#f5f7f9;
  --text:#183142;
}
*{box-sizing:border-box}
body{margin:0;font-family:Aptos,Segoe UI,Arial,sans-serif;color:var(--text);background:#eef2f5}
button,input,select{font:inherit}
.app{height:100vh;display:grid;grid-template-columns:315px 1fr;overflow:hidden}
.menu{background:var(--navy);color:white;overflow:auto;border-right:6px solid var(--orange)}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.14);position:sticky;top:0;background:var(--navy);z-index:4}
.brand .kicker{font-size:12px;letter-spacing:.12em;color:#8ed3ef;font-weight:700}
.brand h1{font-size:24px;margin:4px 0 3px}
.brand p{font-size:13px;line-height:1.35;margin:0;color:#d6e8f2}
.module{border-bottom:1px solid rgba(255,255,255,.12)}
.module-title{padding:14px 18px 8px;color:#95d9f2;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.demo-link{width:100%;border:0;background:transparent;color:white;text-align:left;padding:10px 18px 10px 24px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;border-left:4px solid transparent}
.demo-link:hover{background:rgba(255,255,255,.08)}
.demo-link.active{background:rgba(255,255,255,.14);border-left-color:var(--orange)}
.demo-link .num{min-width:30px;color:#8ed3ef;font-weight:700;font-size:12px;margin-top:2px}
.demo-link .txt{font-size:13px;line-height:1.25}
.menu-footer{padding:16px 18px 28px}
.menu-footer button{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:white;border-radius:7px;cursor:pointer}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:58px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ccd6dd;flex:0 0 auto}
.topbar .title{font-weight:800;color:var(--navy)}
.topbar .slide{font-size:13px;color:#5b6f7d}
.top-actions{display:flex;gap:8px}
.top-actions button{border:1px solid #cbd5dc;background:white;border-radius:7px;padding:8px 12px;cursor:pointer}
.top-actions button.primary{background:var(--green);color:white;border-color:var(--green)}
.stage{overflow:auto;padding:16px}
.demo-card{background:white;border-radius:10px;box-shadow:0 2px 9px rgba(0,0,0,.08);min-height:calc(100vh - 90px);overflow:hidden}
.demo-head{padding:16px 20px;background:linear-gradient(90deg,#f9fbfc,#edf7fb);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.demo-head h2{margin:0 0 4px;font-size:22px;color:var(--navy)}
.demo-head p{margin:0;color:#5e7380;font-size:14px}
.cue{max-width:420px;background:#fff5ea;border-left:4px solid var(--orange);padding:9px 12px;border-radius:5px;font-size:13px}
.excel{margin:18px;border:1px solid #aebac3;box-shadow:0 1px 4px rgba(0,0,0,.12);background:#fff}
.excel-title{height:34px;background:var(--green);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 11px;font-size:13px}
.qat{display:flex;gap:9px;align-items:center}
.qat button{background:transparent;border:0;color:white;cursor:pointer;padding:0}
.ribbon-tabs{display:flex;gap:4px;border-bottom:1px solid #cbd4da;background:#fafafa;padding:0 8px}
.ribbon-tabs button{border:0;background:transparent;padding:8px 11px;cursor:pointer;font-size:12px}
.ribbon-tabs button.active{color:var(--green);font-weight:800;border-bottom:3px solid var(--green)}
.ribbon{min-height:72px;border-bottom:1px solid #c8d0d6;padding:8px;display:flex;gap:8px;align-items:stretch;overflow-x:auto;background:#fff}
.group{border-right:1px solid #d5dce1;padding:0 9px 17px;min-width:max-content;position:relative;display:flex;gap:6px;align-items:flex-start}
.group:after{content:attr(data-label);position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;color:#73838d}
.tool{border:1px solid #d0d8de;background:white;border-radius:4px;padding:5px 7px;cursor:pointer;font-size:12px;min-width:34px}
.tool:hover{background:#eef7f2}
.tool.big{height:38px}
.name-formula{display:grid;grid-template-columns:80px 1fr;border-bottom:1px solid #c8d0d6;height:34px}
.namebox{border-right:1px solid #c8d0d6;padding:7px 8px;font-size:12px}
.formulabar{display:flex;align-items:center;gap:8px;padding:4px 8px}
.fx{font-style:italic;font-weight:700;color:#62727d}
.formulabar input{border:0;outline:0;width:100%;font-size:13px}
.sheet-wrap{overflow:auto;max-height:430px;background:#fff}
.grid{border-collapse:collapse;table-layout:fixed;user-select:text}
.grid th,.grid td{border:1px solid #d3d8dc;height:28px;min-width:88px;max-width:160px;padding:4px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid th{background:#f2f3f5;text-align:center;font-weight:500;color:#4e5d66;position:relative}
.col-resizer{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:5}
.grid th.row{min-width:38px;width:38px;max-width:38px}
.grid td{background:white;position:relative}
.grid td.selected{outline:2px solid var(--green);outline-offset:-2px;background:#eef8f2}
.grid td.range{background:#e6f3eb}
.grid td.headercell{font-weight:700;background:#e8f3ed}
.grid td.totalcell{font-weight:700;border-top:2px solid #4f636f}
.grid td.currency{text-align:right}
.grid td.percent{text-align:right}
.grid td.center{text-align:center}
.grid td[contenteditable="true"]:focus{outline:2px solid var(--green);outline-offset:-2px}
.fill-handle{position:absolute;width:8px;height:8px;background:var(--green);right:-4px;bottom:-4px;border:1px solid white;cursor:crosshair;z-index:3}
.tabs{height:38px;background:#f4f4f4;border-top:1px solid #ccd4d9;display:flex;align-items:flex-end;padding-left:8px;gap:3px;overflow-x:auto}
.tab{padding:7px 16px 6px;border:1px solid transparent;border-bottom:3px solid transparent;background:transparent;cursor:pointer;font-size:12px;white-space:nowrap}
.tab.active{background:white;border-color:#d1d7db;border-bottom-color:var(--green);font-weight:700;color:var(--green)}
.addtab{border:0;background:transparent;font-size:20px;padding:2px 10px 6px;cursor:pointer}
.status{height:24px;background:#f4f4f4;border-top:1px solid #d5dce1;padding:4px 9px;font-size:11px;color:#5d6d76;display:flex;justify-content:space-between}
.preview-panel{padding:18px;display:grid;grid-template-columns:250px 1fr;gap:18px;background:#f2f4f6;min-height:480px}
.print-settings{background:white;border:1px solid #d3dade;padding:14px}
.print-settings h3{margin:0 0 12px;color:var(--navy)}
.print-settings label{display:block;font-size:12px;font-weight:700;margin-top:10px;margin-bottom:4px}
.print-settings select,.print-settings input{width:100%;padding:7px;border:1px solid #c8d1d7;border-radius:4px}
.page{background:white;width:min(720px,100%);min-height:440px;margin:auto;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:42px;position:relative}
.page.landscape{aspect-ratio:11/8.5;min-height:auto}
.page.portrait{aspect-ratio:8.5/11;max-width:470px;min-height:auto}
.page .page-head,.page .page-foot{position:absolute;left:35px;right:35px;font-size:11px;color:#6c7b84;display:flex;justify-content:space-between}
.page .page-head{top:15px}.page .page-foot{bottom:15px}
.page table{border-collapse:collapse;width:100%;font-size:12px}
.page th,.page td{border:1px solid #afb9c0;padding:6px}
.page th{background:#e7f1f6}
.notice{padding:12px 18px;margin:0 18px 18px;border:1px solid #f1c79e;background:#fff7ef;border-radius:7px;font-size:13px}
.hidden{display:none!important}
.context-menu{position:fixed;background:white;border:1px solid #aeb8bf;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:20;min-width:150px;display:none}
.context-menu button{display:block;width:100%;border:0;background:white;text-align:left;padding:8px 11px;font-size:12px;cursor:pointer}
.context-menu button:hover{background:#edf4f7}
.demo-menu-only{padding:28px}
.demo-menu-only h2{color:var(--navy);margin-top:0}
.demo-menu-only p{max-width:850px;line-height:1.5}
@media(max-width:900px){
  .app{grid-template-columns:240px 1fr}
  .cue{display:none}
  .grid th,.grid td{min-width:75px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="menu">
    <div class="brand">
      <div class="kicker">C² TECHNOLOGIES</div>
      <h1>Excel 101 Demo Hub</h1>
      <p>Select any line to jump straight to the matching live demo.</p>
    </div>
    <div id="menuList"></div>
    <div class="menu-footer"><button id="resetAll">Reset All Demos</button></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><div class="title" id="topTitle">Excel 101 Live Demo Hub</div><div class="slide" id="topSlide">Choose a demo from the menu.</div></div>
      <div class="top-actions">
        <button id="menuHome">Main Menu</button>
        <button id="resetDemo">Reset Current Demo</button>
      </div>
    </div>
    <div class="stage"><div id="demoCard" class="demo-card"></div></div>
  </main>
</div>
<div id="contextMenu" class="context-menu">
  <button data-tab-action="rename">Rename</button>
  <button data-tab-action="delete">Delete</button>
</div>
<script>
const modules = [
 {name:"Module 1 · Navigating Excel", demos:[
  ["4","Navigating the Workspace","workspace"],
  ["5","Workbook vs. Worksheet","workbook"],
  ["6","Moving Around Your Data","move"]
 ]},
 {name:"Module 2 · Entering & Formatting Data", demos:[
  ["10","Entering Your Data","entry"],
  ["11","Highlighting Data Efficiently","select"],
  ["12","The Fill Handle","fill"],
  ["13","Styling Your Data","style"],
  ["14","Adjusting Grid Dimensions","dimensions"],
  ["15","Formatting Numerical Data","numbers"],
  ["16","Cell Styles","cellstyles"]
 ]},
 {name:"Module 3 · Managing Worksheets", demos:[
  ["20","Add & Delete Worksheets","sheets"],
  ["21","Name & Arrange Tabs","tabs"]
 ]},
 {name:"Module 4 · Basic Formulas & Functions", demos:[
  ["24","Anatomy of a Formula","formula"],
  ["25","Arithmetic Operators","operators"],
  ["26","Dynamic Formulas","dynamic"],
  ["27","Relative vs. Absolute References","references"],
  ["29","SUM","sum"],
  ["30","AVERAGE","average"],
  ["31","MAX & MIN","maxmin"],
  ["32","COUNT","count"]
 ]},
 {name:"Module 5 · Saving & Printing", demos:[
  ["35","Save & Name a Workbook","save"],
  ["36","Page Layout & Orientation","layout"],
  ["37","Headers & Footers","headers"],
  ["38","Print Area","printarea"],
  ["39","Print Preview","preview"]
 ]}
];

const defs = {};
modules.forEach(m=>m.demos.forEach(d=>defs[d[2]]={slide:d[0],title:d[1],module:m.name}));

const menuList = document.getElementById("menuList");
modules.forEach(m=>{
  const sec=document.createElement("div"); sec.className="module";
  sec.innerHTML=`<div class="module-title">${m.name}</div>`;
  m.demos.forEach(([slide,title,id])=>{
    const b=document.createElement("button"); b.className="demo-link"; b.dataset.demo=id;
    b.innerHTML=`<span class="num">S${slide}</span><span class="txt">${title}</span>`;
    sec.appendChild(b);
  });
  menuList.appendChild(sec);
});

const card=document.getElementById("demoCard");
let currentDemo=null;
let currentCell=null;
let selectionStart=null;
let fillStart=null;
let tabTarget=null;
const snapshots={};
const sheetBooks={};
let historyStack=[];
let redoStack=[];
let editStartState=null;
let resizeState=null;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function letters(n){let a=[];for(let i=0;i<n;i++)a.push(String.fromCharCode(65+i));return a}

function grid(rows=10, cols=7, values={}, opts={}){
 let h=`<div class="sheet-wrap"><table class="grid" data-grid><thead><tr><th class="row"></th>`;
 letters(cols).forEach((l,i)=>h+=`<th class="colhead" data-col="${i}">${l}<span class="col-resizer" data-resize-col="${i}"></span></th>`);
 h+=`</tr></thead><tbody>`;
 for(let r=1;r<=rows;r++){
  h+=`<tr><th class="row rowhead" data-row="${r}">${r}</th>`;
  for(let c=0;c<cols;c++){
   const addr=letters(cols)[c]+r; const v=values[addr]??"";
   h+=`<td contenteditable="true" data-cell="${addr}" data-row="${r}" data-col="${c}">${esc(v)}</td>`;
  }
  h+=`</tr>`;
 }
 h+=`</tbody></table></div>`;
 return h;
}

function excelShell(inner, options={}){
 const tabs=options.tabs||["Sheet1"];
 return `<div class="excel" data-excel>
   <div class="excel-title"><div class="qat"><b>Excel 101 Demo.xlsx</b><button title="Save" data-qat="save">💾</button><button title="Undo" data-qat="undo">↶</button><button title="Redo" data-qat="redo">↷</button></div><div>— □ ×</div></div>
   <div class="ribbon-tabs">${["File","Home","Insert","Page Layout","Formulas","Data","Review","View"].map((x,i)=>`<button class="${i==1?"active":""}" data-ribbon-tab="${x}">${x}</button>`).join("")}</div>
   <div class="ribbon" data-ribbon>
     <div class="group" data-label="Clipboard"><button class="tool">Paste</button><button class="tool">Copy</button></div>
     <div class="group" data-label="Font"><button class="tool" data-format="bold"><b>B</b></button><button class="tool" data-format="italic"><i>I</i></button><button class="tool" data-format="fill">Fill</button></div>
     <div class="group" data-label="Number"><button class="tool" data-format="currency">$</button><button class="tool" data-format="percent">%</button><button class="tool" data-format="decdown">.0←</button><button class="tool" data-format="decup">.00→</button></div>
     <div class="group" data-label="Styles"><button class="tool" data-style="Heading">Heading</button><button class="tool" data-style="Total">Total</button></div>
     <div class="group" data-label="Editing"><button class="tool" data-autosum>Σ AutoSum</button></div>
   </div>
   <div class="name-formula"><div class="namebox" data-namebox>A1</div><div class="formulabar"><span class="fx">fx</span><input data-formula placeholder="Formula bar"></div></div>
   ${inner}
   <div class="tabs" data-tabs>${tabs.map((t,i)=>`<button class="tab ${i===0?"active":""}" draggable="true" data-tab="${esc(t)}">${esc(t)}</button>`).join("")}<button class="addtab" data-addtab>+</button></div>
   <div class="status"><span>Ready</span><span>100%</span></div>
 </div>`;
}

function header(title, cue){
 const d=defs[currentDemo];
 return `<div class="demo-head"><div><h2>${title}</h2><p>${d.module} · PowerPoint Slide ${d.slide}</p></div><div class="cue">${cue}</div></div>`;
}

function baseValues(){
 return {"A1":"Department","B1":"Q1","C1":"Q2","D1":"Q3","E1":"Q4",
 "A2":"Facilities","B2":"4820","C2":"5140","D2":"4980","E2":"5210",
 "A3":"Operations","B3":"7615","C3":"7203","D3":"7890","E3":"7520",
 "A4":"Customer Service","B4":"3910","C4":"4270","D4":"4155","E4":"4390",
 "A5":"IT","B5":"5480","C5":"5710","D5":"5900","E5":"6060"};
}

function buildDemo(id, forceReset=false){
 currentDemo=id; currentCell=null;
 if(!forceReset && snapshots[id]){
   card.innerHTML=snapshots[id];
   document.querySelectorAll(".demo-link").forEach(x=>x.classList.toggle("active",x.dataset.demo===id));
   document.getElementById("topTitle").textContent=defs[id].title;
   document.getElementById("topSlide").textContent=`PowerPoint Slide ${defs[id].slide} · ${defs[id].module}`;
   afterBuild(id, true);
   return;
 }
 document.querySelectorAll(".demo-link").forEach(x=>x.classList.toggle("active",x.dataset.demo===id));
 document.getElementById("topTitle").textContent=defs[id].title;
 document.getElementById("topSlide").textContent=`PowerPoint Slide ${defs[id].slide} · ${defs[id].module}`;

 let body="";
 if(id==="workspace"){
  body=header("Navigating the Workspace","Point out the Quick Access Toolbar, Ribbon, Name Box and Formula Bar.")+
  excelShell(grid(7,7,{"A1":"Employee","B1":"Hours","C1":"Week Of","A2":"Dana Reyes","B2":"38","C2":"3/2/2026"}));
 }
 if(id==="workbook"){
  body=header("Workbook vs. Worksheet","Use the title bar for the workbook, then select the worksheet tabs along the bottom.")+
  excelShell(grid(7,6,baseValues()),{tabs:["Sales","Human Resources","Marketing"]});
 }
 if(id==="move"){
  body=header("Moving Around Your Data","Select cells, use the keyboard arrows and switch between Q1–Q4 tabs.")+
  excelShell(grid(12,7,baseValues()),{tabs:["Q1","Q2","Q3","Q4"]});
 }
 if(id==="entry"){
  body=header("Entering Your Data","Type a name, a number and a date. As you type, point out the matching entry in the Formula Bar and Excel-style alignment of text versus numbers/dates.")+
  excelShell(grid(8,6,{"A1":"Employee","B1":"Hours","C1":"Week Of","A2":"Dana Reyes","B2":"38","C2":"3/2/2026"}));
 }
 if(id==="select"){
  body=header("Highlighting Data Efficiently","Demonstrate a cell range, then select a full column and a full row.")+
  excelShell(grid(10,7,baseValues()));
 }
 if(id==="fill"){
  body=header("Automating Data Entry: The Fill Handle","Select Monday, then drag the small green handle down. Try the same with January or a plain number.")+
  excelShell(grid(12,5,{"A1":"Day","A2":"Monday","B1":"Month","B2":"January","C1":"Room","C2":"101"}));
 }
 if(id==="style"){
  body=header("Styling Your Data","Select the header row and totals, then apply bold, fill and number formatting.")+
  excelShell(grid(9,6,{"A1":"Department","B1":"Q1","C1":"Q2","A2":"Facilities","B2":"4820","C2":"5140","A3":"Operations","B3":"7615","C3":"7203","A4":"Total","B4":"12435","C4":"12343"}));
 }
 if(id==="dimensions"){
  body=header("Adjusting Grid Dimensions","Drag a column boundary. Double-select a boundary to AutoFit the longest value.")+
  excelShell(grid(7,5,{"A1":"Item","B1":"Amount","A2":"Training Room Rental","B2":"12450","A3":"Technology Equipment Rental","B3":"8900"}));
 }
 if(id==="numbers"){
  body=header("Formatting Numerical Data","Select each raw value and use the Number group to apply Currency, Percentage or decimal changes.")+
  excelShell(grid(7,5,{"A1":"Type","B1":"Raw Value","A2":"Currency","B2":"1284.5","A3":"Percentage","B3":"0.125","A4":"Decimals","B4":"3.14159"}));
 }
 if(id==="cellstyles"){
  body=header("Consistent Formatting with Cell Styles","Apply Heading to the title or headers and Total to the total row.")+
  excelShell(grid(9,6,{"A1":"Quarterly Expense Summary","A3":"Department","B3":"Q1","C3":"Q2","A4":"Facilities","B4":"4820","C4":"5140","A5":"Operations","B5":"7615","C5":"7203","A6":"Total","B6":"12435","C6":"12343"}));
 }
 if(id==="sheets"){
  body=header("Managing Your Worksheets","Use + to add a worksheet. Right-select a tab for Rename or Delete.")+
  excelShell(grid(7,6,baseValues()),{tabs:["Sales","HR","Marketing","Old_Draft"]});
 }
 if(id==="tabs"){
  body=header("Name and Arrange Your Tabs","Double-select a tab to rename it. Drag tabs left or right to reorder them.")+
  excelShell(grid(7,6,baseValues()),{tabs:["Sheet1","Sheet2","Sheet3","Sheet4"]});
 }
 if(id==="formula"){
  body=header("Anatomy of a Formula","Select B4 and type =B2+B3 in the Formula Bar. Press Enter to calculate the total.")+
  excelShell(grid(8,5,{"A1":"Expense","B1":"Amount","A2":"Registration","B2":"250","A3":"Materials","B3":"175","A4":"Total","B4":""}));
 }
 if(id==="operators"){
  body=header("Basic Arithmetic Operators","Use +, -, * and / in formulas. Start every formula with =.")+
  excelShell(grid(9,6,{"A1":"Value 1","B1":"Value 2","C1":"Addition","D1":"Subtract","E1":"Multiply","F1":"Divide","A2":"12","B2":"4"}));
 }
 if(id==="dynamic"){
  body=header("Dynamic Formulas","Build =A2+B2 by selecting cells, then change A2 from 10 to 20 and watch C2 recalculate.")+
  excelShell(grid(7,5,{"A1":"A","B1":"B","C1":"Total","A2":"10","B2":"5","C2":"=A2+B2"}));
 }
 if(id==="references"){
  body=header("Relative vs. Absolute References","Enter formulas in C2, then drag the fill handle down. Compare relative references with a locked $A$2 reference.")+
  excelShell(grid(10,6,{"A1":"Fixed Rate","B1":"Value","C1":"Relative","D1":"Absolute","A2":"1.5","B2":"10","C2":"=A2+B2","D2":"=$A$2+B2","B3":"20","B4":"30","B5":"40"}));
 }
 if(["sum","average","maxmin","count"].includes(id)){
   const common={"A1":"Item","B1":"Units","A2":"Binders","B2":"120","A3":"Paper","B3":"85","A4":"Pens","B4":"143","A5":"Toner","B5":"96","A6":"Folders","B6":"110"};
   if(id==="sum"){
    body=header("Adding It All Up: SUM","Type =SUM(B2:B6), then show AutoSum for the same result.")+
      excelShell(grid(10,5,{...common,"A7":"Total","B7":""}));
   }
   if(id==="average"){
    body=header("Calculating the Mean: AVERAGE","Type =AVERAGE(B2:B7) and compare the result with the individual values.")+
      excelShell(grid(11,5,{"A1":"Month","B1":"Sales","A2":"Jan","B2":"48200","A3":"Feb","B3":"51700","A4":"Mar","B4":"49300","A5":"Apr","B5":"55600","A6":"May","B6":"52900","A7":"Jun","B7":"58100","A8":"Average","B8":""}));
   }
   if(id==="maxmin"){
    body=header("Finding Extremes: MAX and MIN","Use MAX and MIN to identify the highest and lowest value without sorting.")+

function cellByAddr(addr){return card.querySelector(`[data-cell="${addr}"]`)}

function getVal(addr){
 const c=cellByAddr(addr);
 if(!c)return 0;
 const t=c.textContent.trim();
 const n=parseFloat(t.replace(/[$,%]/g,""));
 return isNaN(n)?0:n;
}

function evalFormula(f){
 let s=f.trim();
 if(!s.startsWith("="))return s;
 const up=s.toUpperCase();
 const func=up.match(/^=(SUM|AVERAGE|MAX|MIN|COUNT)\(([A-Z]+\d+):([A-Z]+\d+)\)$/);
 if(func){
  const vals=rangeValues(func[2],func[3]);
  if(func[1]==="SUM")return vals.reduce((a,b)=>a+b,0);
  if(func[1]==="AVERAGE")return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  if(func[1]==="MAX")return vals.length?Math.max(...vals):0;
  if(func[1]==="MIN")return vals.length?Math.min(...vals):0;
  if(func[1]==="COUNT")return vals.length;
 }
 s=s.slice(1).replace(/\$([A-Z]+)\$/g,"$1").replace(/\$([A-Z]+)/g,"$1").replace(/([A-Z]+)\$(\d+)/g,"$1$2");
 s=s.replace(/\b([A-Z]+[0-9]+)\b/g,(m)=>String(getVal(m)));
 if(!/^[0-9+\-*/().\s]+$/.test(s))return "#ERROR";
 try{return Function(`"use strict";return (${s})`)()}catch(e){return "#ERROR"}
}

function rangeValues(a,b){
 const ma=a.match(/([A-Z]+)(\d+)/), mb=b.match(/([A-Z]+)(\d+)/);
 const ca=ma[1].charCodeAt(0)-65, cb=mb[1].charCodeAt(0)-65;
 const ra=+ma[2], rb=+mb[2], vals=[];
 for(let r=Math.min(ra,rb);r<=Math.max(ra,rb);r++)for(let c=Math.min(ca,cb);c<=Math.max(ca,cb);c++){
   const td=card.querySelector(`[data-row="${r}"][data-col="${c}"]`);
   if(td){
    const t=td.textContent.trim().replace(/[$,%]/g,"");
    if(t!==""&&!isNaN(Number(t)))vals.push(Number(t));
   }
 }
 return vals;
}

function recalcAll(){
 // Convert any visible formulas to stored formulas, then recalculate all stored formulas.
 card.querySelectorAll("[data-grid] td").forEach(td=>{
   const t=td.textContent.trim();
   if(t.startsWith("=") && !td.dataset.formulaSrc){ td.dataset.formulaSrc=t; }
 });
 // Multiple passes allow simple formula dependencies to settle.
 for(let pass=0;pass<3;pass++){
   card.querySelectorAll("td[data-formula-src]").forEach(td=>{
     const result=evalFormula(td.dataset.formulaSrc);
     td.textContent=result;
     td.dataset.raw=String(result);
     inferCellType(td);
   });
 }
 if(currentCell) setFormulaBarFromCell(currentCell);
}

function selectCell(td, extend=false){
 if(!extend)card.querySelectorAll(".selected,.range").forEach(x=>x.classList.remove("selected","range"));
 currentCell=td;
 td.classList.add("selected");
 const nb=card.querySelector("[data-namebox]"); if(nb) nb.textContent=td.dataset.cell;
 const formula=card.querySelector("[data-formula]");
 if(formula) formula.value=td.dataset.formulaSrc||td.dataset.raw||td.textContent;
 // Do not mutate the contents of a cell while the user is actively editing it.
 if(document.activeElement!==td) addHandle(td);
}

function setFormulaBarFromCell(td){
 const formula=card.querySelector("[data-formula]");
 if(formula && td) formula.value=td.dataset.formulaSrc||td.dataset.raw||td.textContent;
}

function inferCellType(td){
 if(!td) return;
 const raw=(td.dataset.raw ?? td.textContent).trim();
 td.style.textAlign="left";
 if(raw==="") return;
 if(/^[-+]?\d+(\.\d+)?$/.test(raw.replace(/,/g,""))){td.style.textAlign="right"; return;}
 if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(raw)){td.style.textAlign="right"; return;}
}

function initializeCellTypes(){
 card.querySelectorAll('td[data-cell]').forEach(td=>{
   if(!td.dataset.raw && !td.dataset.formulaSrc) td.dataset.raw=td.textContent.trim();
   inferCellType(td);
 });
}

function addHandle(td){
 card.querySelectorAll(".fill-handle").forEach(x=>x.remove());
 if(!td || document.activeElement===td) return;
 const h=document.createElement("span");
 h.className="fill-handle";
 h.title="Fill Handle";
 h.setAttribute("contenteditable","false");
 td.appendChild(h);
}

function fillDown(source, target){
 pushHistory();
 const sc=+source.dataset.col, sr=+source.dataset.row, tr=+target.dataset.row;
 if(+target.dataset.col!==sc || tr<=sr)return;
 let value=source.dataset.formulaSrc||source.textContent.trim();
 const day=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
 const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
 let list=day.includes(value)?day:months.includes(value)?months:null;
 for(let r=sr+1;r<=tr;r++){
   const td=card.querySelector(`[data-row="${r}"][data-col="${sc}"]`); if(!td)continue;
   if(list){
     const idx=list.indexOf(value)+(r-sr);td.textContent=list[idx%list.length];
   } else if(value.startsWith("=")){
     const shifted=shiftFormula(value,r-sr);
     td.dataset.formulaSrc=shifted; td.textContent=evalFormula(shifted);
   } else td.textContent=value;
 }
 recalcAll();
 persistCurrentState();
}

function shiftFormula(formula, delta){
 return formula.replace(/(\$?)([A-Z]+)(\$?)(\d+)/g,(m,ac,col,ar,row)=>{
  if(ar==="$")return m;
  return `${ac}${col}${ar}${Number(row)+delta}`;
 });
}

function applyFormat(f){

  if(f==="fill")td.style.background="#dbeef7";
  if(f==="currency"){
   const n=parseFloat((td.dataset.raw||td.textContent).replace(/[$,]/g,""));if(!isNaN(n)){td.dataset.raw=String(n);td.textContent=n.toLocaleString("en-US",{style:"currency",currency:"USD"});td.classList.add("currency");td.style.textAlign="right"}
  }
  if(f==="percent"){
   const n=parseFloat((td.dataset.raw||td.textContent).replace("%",""));if(!isNaN(n)){td.dataset.raw=String(n);td.textContent=(n*100).toFixed(1)+"%";td.classList.add("percent");td.style.textAlign="right"}
  }
  if(f==="decdown"){
   const n=parseFloat(td.textContent.replace(/[$,%]/g,""));if(!isNaN(n))td.textContent=n.toFixed(2);
  }
  if(f==="decup"){
   const n=parseFloat(td.textContent.replace(/[$,%]/g,""));if(!isNaN(n))td.textContent=n.toFixed(4);
  }
 });
}

function commitCellEdit(td){
 if(!td) return;
 // Remove any non-editing UI before reading the cell value.
 td.querySelectorAll(".fill-handle").forEach(x=>x.remove());
 const raw=td.textContent.trim();
 if(raw.startsWith("=")){
   td.dataset.formulaSrc=raw;
   td.textContent=evalFormula(raw);
   td.dataset.raw=td.textContent;
 }else{
   delete td.dataset.formulaSrc;
   td.dataset.raw=raw;
   td.textContent=raw;
 }
 inferCellType(td);
 recalcAll();
 persistCurrentState();
}

function commitFormula(){
 if(!currentCell)return;
 const inp=card.querySelector("[data-formula]"); const f=inp.value.trim();
 if(f.startsWith("=")){currentCell.dataset.formulaSrc=f;currentCell.textContent=evalFormula(f);currentCell.dataset.raw=currentCell.textContent}
 else {delete currentCell.dataset.formulaSrc;currentCell.textContent=f;currentCell.dataset.raw=f}
 inferCellType(currentCell); recalcAll(); addHandle(currentCell); persistCurrentState();
}

function autoSum(){

 const f=`=SUM(${letter}2:${letter}${r-1})`;
 currentCell.dataset.formulaSrc=f;currentCell.textContent=evalFormula(f);currentCell.dataset.raw=currentCell.textContent;
 recalcAll();
}

}
function presetSheets(id){
 const mk=(v)=>{const temp={}; Object.entries(v).forEach(([a,x])=>temp[a]={html:String(x),formula:'',raw:String(x),style:'',className:''}); return temp};
 if(id==='workbook') return {
  'Sales':mk({'A1':'Month','B1':'Sales','A2':'January','B2':'48200','A3':'February','B3':'51700','A4':'March','B4':'49300'}),
  'Human Resources':mk({'A1':'Employee','B1':'Hours','A2':'Dana Reyes','B2':'38','A3':'Marcus Cole','B3':'41.5'}),
  'Marketing':mk({'A1':'Campaign','B1':'Leads','A2':'Spring Outreach','B2':'128','A3':'Email Campaign','B3':'145'})};
 if(id==='move') return {
  'Q1':mk({'A1':'Department','B1':'Jan','C1':'Feb','D1':'Mar','A2':'Facilities','B2':'4820','C2':'5140','D2':'4980','A3':'Operations','B3':'7615','C3':'7203','D3':'7890'}),
  'Q2':mk({'A1':'Department','B1':'Apr','C1':'May','D1':'Jun','A2':'Facilities','B2':'5210','C2':'5340','D2':'5480','A3':'Operations','B3':'7520','C3':'7600','D3':'7740'}),
  'Q3':mk({'A1':'Department','B1':'Jul','C1':'Aug','D1':'Sep','A2':'Facilities','B2':'5520','C2':'5610','D2':'5700','A3':'Operations','B3':'7810','C3':'7960','D3':'8050'}),
  'Q4':mk({'A1':'Department','B1':'Oct','C1':'Nov','D1':'Dec','A2':'Facilities','B2':'5750','C2':'5880','D2':'5990','A3':'Operations','B3':'8120','C3':'8260','D3':'8400'})};
 return {};
}
function initializeSheetBook(id, restored=false){
 const tabs=[...card.querySelectorAll('.tab')]; if(!tabs.length)return;
 if(!sheetBooks[id]){
   sheetBooks[id]={active:tabs.find(t=>t.classList.contains('active'))?.dataset.tab||tabs[0].dataset.tab,sheets:{}};
   Object.assign(sheetBooks[id].sheets,presetSheets(id));
   const active=sheetBooks[id].active; if(!sheetBooks[id].sheets[active])sheetBooks[id].sheets[active]=captureGrid();
 }
 if(!restored){ const active=sheetBooks[id].active; if(sheetBooks[id].sheets[active])restoreGrid(sheetBooks[id].sheets[active],true); }
}
function switchSheet(tab){
 if(!currentDemo)return; const book=sheetBooks[currentDemo]||(sheetBooks[currentDemo]={active:tab.dataset.tab,sheets:{}});
 const old=card.querySelector('.tab.active'); if(old){book.sheets[old.dataset.tab]=captureGrid(); old.classList.remove('active');}
 tab.classList.add('active'); book.active=tab.dataset.tab;
 if(!book.sheets[book.active]) book.sheets[book.active]={};
 restoreGrid(book.sheets[book.active],true);
 const first=card.querySelector('td[data-cell]'); if(first)selectCell(first);
}

function addTab(){
 pushHistory(); const tabs=card.querySelector("[data-tabs]"); if(!tabs)return;
 const n=tabs.querySelectorAll(".tab").length+1;
 const b=document.createElement("button");b.className="tab";b.draggable=true;b.dataset.tab="Sheet"+n;b.textContent="Sheet"+n;
 tabs.insertBefore(b,tabs.querySelector(".addtab"));
 if(currentDemo && sheetBooks[currentDemo]) sheetBooks[currentDemo].sheets[b.dataset.tab]={};
 switchSheet(b);
}

function renameTab(tab){
 const old=tab.dataset.tab; const name=prompt("New worksheet name:",tab.textContent);if(name){pushHistory();tab.textContent=name;tab.dataset.tab=name;if(currentDemo&&sheetBooks[currentDemo]){const b=sheetBooks[currentDemo];b.sheets[name]=b.sheets[old]||captureGrid();delete b.sheets[old];if(b.active===old)b.active=name}}
}
function tabAction(a){
 document.getElementById("contextMenu").style.display="none";
 if(!tabTarget)return;
 if(a==="rename")renameTab(tabTarget);
 if(a==="delete"){
  if(card.querySelectorAll(".tab").length<=1){alert("A workbook must contain at least one worksheet.");return}
  pushHistory(); const dead=tabTarget.dataset.tab; const wasActive=tabTarget.classList.contains('active'); tabTarget.remove();
  if(currentDemo&&sheetBooks[currentDemo]) delete sheetBooks[currentDemo].sheets[dead];
  if(wasActive){const next=card.querySelector('.tab'); if(next)switchSheet(next)}
 }
}

document.addEventListener("dragstart",e=>{
 const t=e.target.closest(".tab"); if(t)e.dataTransfer.setData("text/plain",t.dataset.tab);
});
document.addEventListener("dragover",e=>{if(e.target.closest(".tab"))e.preventDefault()});
document.addEventListener("drop",e=>{
 const target=e.target.closest(".tab"); if(!target)return;e.preventDefault();
 const name=e.dataTransfer.getData("text/plain");const src=[...card.querySelectorAll(".tab")].find(x=>x.dataset.tab===name);
 if(src&&src!==target)target.parentElement.insertBefore(src,target);
});

function autoFit(c){
 pushHistory();
 let max=5;card.querySelectorAll(`td[data-col="${c}"]`).forEach(td=>max=Math.max(max,td.textContent.length));
 const w=Math.min(220,Math.max(78,max*8+20));
 setColumnWidth(c,w);
}


function setColumnWidth(c,w){
 const th=card.querySelector(`th[data-col="${c}"]`); if(th){th.style.minWidth=w+"px";th.style.width=w+"px";th.style.maxWidth=w+"px"}
 card.querySelectorAll(`td[data-col="${c}"]`).forEach(td=>{td.style.minWidth=w+"px";td.style.width=w+"px";td.style.maxWidth=w+"px"});
}

 const home=`<div class="group" data-label="Clipboard"><button class="tool">Paste</button><button class="tool">Copy</button></div><div class="group" data-label="Font"><button class="tool" data-format="bold"><b>B</b></button><button class="tool" data-format="italic"><i>I</i></button><button class="tool" data-format="fill">Fill</button></div><div class="group" data-label="Number"><button class="tool" data-format="currency">$</button><button class="tool" data-format="percent">%</button><button class="tool" data-format="decdown">.0←</button><button class="tool" data-format="decup">.00→</button></div><div class="group" data-label="Styles"><button class="tool" data-style="Heading">Heading</button><button class="tool" data-style="Total">Total</button></div><div class="group" data-label="Editing"><button class="tool" data-autosum>Σ AutoSum</button></div>`;
 const map={
  'File':`<div class="group" data-label="Workbook"><button class="tool">Info</button><button class="tool">New</button><button class="tool">Open</button><button class="tool" data-qat="save">Save</button><button class="tool">Print</button></div>`,

  'View':`<div class="group" data-label="Workbook Views"><button class="tool">Normal</button><button class="tool">Page Break Preview</button><button class="tool">Page Layout</button></div><div class="group" data-label="Show"><button class="tool">Formula Bar</button><button class="tool">Gridlines</button><button class="tool">Headings</button></div><div class="group" data-label="Zoom"><button class="tool">Zoom</button><button class="tool">100%</button></div>`
 };

function applyPage(){
 const p=document.getElementById("pagePreview");if(!p)return;
 const o=document.getElementById("orientation").value;
 const scaling=document.getElementById("scaling")?.value||"No Scaling";
 p.classList.toggle("landscape",o==="Landscape");p.classList.toggle("portrait",o==="Portrait");
 const h=document.getElementById("headerText"),f=document.getElementById("footerText");
 if(h)document.getElementById("pageHeader").textContent=h.value;
 if(f)document.getElementById("pageFooter").textContent=f.value;
 const status=document.getElementById("previewStatus");
 if(status){
   const pages=(scaling==="Fit Sheet on One Page")?1:(o==="Portrait"?2:1);
   status.textContent=`Preview: ${o} · ${scaling} · ${pages} page${pages===1?'':'s'}`;
 }
}

document.addEventListener('input',e=>{
 if(e.target.id==='headerText'||e.target.id==='footerText') applyPage();
});
document.addEventListener('change',e=>{
 if(e.target.id==='orientation'||e.target.id==='scaling') applyPage();
});

function persistCurrentState(){
 if(!currentDemo) return;
 const active=card.querySelector(".tab.active");
 if(active && sheetBooks[currentDemo]) sheetBooks[currentDemo].sheets[active.dataset.tab]=captureGrid();
 snapshots[currentDemo]=card.innerHTML;
}

function saveSnapshot(){persistCurrentState()}

function showHome(){
 saveSnapshot();currentDemo=null;
 document.querySelectorAll(".demo-link").forEach(x=>x.classList.remove("active"));
 document.getElementById("topTitle").textContent="Excel 101 Live Demo Hub";
 document.getElementById("topSlide").textContent="Choose any demo from the left menu.";
 card.innerHTML=`<div class="demo-menu-only"><h2>Live Demo Menu</h2><p>This site is organized to mirror the live-demo moments in the Excel 101 PowerPoint. Select any line in the left menu to open a prebuilt demo workspace for that exact topic. Several demos share the same Excel-style workspace, but every course demo has its own menu line and starting state.</p><p>Each demo keeps its working state while this browser session is open. Use Reset Current Demo or Reset All Demos whenever you want a clean starting point.</p></div>`;
}
showHome();
</script>
