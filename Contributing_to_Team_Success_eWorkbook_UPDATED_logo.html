  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

11px;padding:10px;background:#fbfdfe;color:var(--i)}textarea{min-height:90px;resize:vertical}.choice{display:flex;gap:7px;align-items:flex-start;padding:8px 9px;border:1px solid #d9e7ed;border-radius:10px;background:#fff;font-weight:650;color:var(--i);margin:5px 0}.table{overflow:auto;border:1px solid #dbe8ee;border-radius:15px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e3edf2;text-align:left;vertical-align:top}thead th{background:var(--n);color:#fff;font-size:12.5px}.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.zone{min-height:140px;border:2px dashed #b8d1dd;border-radius:15px;padding:10px;background:#fbfdfe}.zone h4{text-align:center;color:var(--n);margin:0 0 8px}.item{display:flex;gap:6px;margin:6px 0}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:850}.primary{background:var(--n);color:#fff}.alt{background:#fff;color:var(--n);border:1px solid #bfd6e0}.metric{display:grid;grid-template-columns:130px 1fr 45px;gap:8px;align-items:center;margin:8px 0}.meter{height:12px;border-radius:10px;background:#dfeaf0;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--b));width:50%}.gameChoice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid #cddfe7;background:#fff;border-radius:12px;font-weight:700}.result{padding:11px;border-radius:12px;background:#f7fbfd;border:1px solid #dce8ee;min-height:50px}.auction{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.auction>div{padding:13px;border:1px solid #d7e5ec;border-radius:15px;background:#fbfdfe}.score{display:inline-block;padding:8px 11px;border-radius:999px;background:var(--c);border:1px solid #f0d0a7;font-weight:900;color:#8c4c12}.score.over{background:#fff0ee;border-color:#e2b4ae;color:#9c3f36}.phoenix{border:1px solid #d5e6ed;border-radius:20px;overflow:hidden}.phxhead{padding:17px 19px;background:linear-gradient(120deg,var(--n),#124f6b);color:#fff}.phxgrid{display:grid;grid-template-columns:repeat(4,1fr)}.phxgrid>div{padding:15px;border-right:1px solid #e0ebef}.alert{padding:14px 16px;border-left:5px solid var(--o);background:#fff7ed;border-radius:12px;margin:12px 0}.toolbar{position:sticky;bottom:0;display:flex;gap:9px;align-items:center;margin-top:28px;padding:15px 0;background:linear-gradient(180deg,#fff0,#fffffff2 35%)}.toolbar .status{margin-right:auto;padding:8px 11px;border-radius:999px;background:#fff;border:1px solid #dbe8ee;font-size:12px;color:#607782}.footer{text-align:center;color:#71858e;font-size:12px;margin-top:24px}\n@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{display:flex;flex-wrap:wrap}.nav a{flex:1 1 210px}.g3,.g4,.zones,.auction,.phxgrid{grid-template-columns:1fr 1fr}}\n@media(max-width:650px){.main{padding:18px 12px 70px}.hero,.card{padding:20px 16px}.g2,.g3,.g4,.zones,.auction,.phxgrid{grid-template-columns:1fr}.head{display:block}.metric{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar .status{width:100%;margin:0;text-align:center}}\n@media print{body{background:#fff}.shell{display:block}.side,.toolbar{display:none}.main{padding:0;max-width:none}.hero,.card,.section,.phoenix{box-shadow:none;break-inside:avoid}}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div class=\"shell\">\n<aside class=\"side\">\n<div class=\"brand\"><img class=\"logoImg\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIcAAACHCAYAAAA850oKAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFxEAABcRAcom8z8AACyTSURBVHhe7X0JeBTXlW7eSybzMpN5mSVvJjPPxmzecMDG+4aD432JEzsZ27Gd2OPYiZ04jhM7z+PEuw1oQYDAIITMvpnFGAyYRa3Wvu9IaN8lJIT2Xd1d9/zvO7duqVslIVqtaiFA5/vOh4BWddW9f51z7lm/9rXzkAB8HcA3AXybiP4NwBVENI+IHiOiF4joDSL6QAixVAixWgixTgixSfFGIcRaIcQqIUQIEb2nadqfADxHRI8Q0S1EdCmA7wL4O/U9XzffwyRNEALwPwF8g4j+FsA/EtEMIrqNiB4lot8S0YdEFEZEu4UQNiFEiqZpx4QQJUKIKiFEjRCi1mAiqhZCVAohioQQOUKIZE3TjgohdgghPiGidwH8mogeJqIbAUwlov+tvp+B+T/M9zhJ40wA/gbAPwG4iojuVxvGEoElwSHeVCFEvtroBiJqE0L0CiGcQghBRB \"><span class=\"dot\"><\u002Fspan>Communication &amp; Trust<\u002Fa><a class=\"sub\" href=\"#trust-bank\"><span class=\"hnum\">09<\u002Fspan>Trust Bank: Paper Decision Game<\u002Fa><a class=\"sub\" href=\"#act10\"><span class=\"hnum\">10<\u002Fspan>Triad Practice<\u002Fa><a class=\"sub\" href=\"#act11\"><span class=\"hnum\">11<\u002Fspan>Trust Micro-Commitment<\u002Fa><a href=\"#conflict\"><span class=\"dot\"><\u002Fspan>Collaborative Conflict<\u002Fa><a class=\"sub\" href=\"#act12\"><span class=\"hnum\">12<\u002Fspan>Resolve the Work, Not the Person<\u002Fa><a class=\"sub\" href=\"#act13\"><span class=\"hnum\">13<\u002Fspan>Section 4 Reflection<\u002Fa><a href=\"#ownership\"><span class=\"dot\"><\u002Fspan>Ownership &amp; Initiative<\u002Fa><a class=\"sub\" href=\"#act14\"><span class=\"hnum\">14<\u002Fspan>Opportunity Scan<\u002Fa><a class=\"sub\" href=\"#act15\"><span class=\"hnum\">15<\u002Fspan>Ownership Auction<\u002Fa><a class=\"sub\" href=\"#act16\"><span class=\"hnum\">16<\u002Fspan>Choose the Ownership Move<\u002Fa><a href=\"#phoenix\"><span class=\"dot\"><\u002Fspan>Project Phoenix<\u002Fa><a class=\"sub\" href=\"#act17\"><span class=\"hnum\">17<\u002Fspan>Project Phoenix Capstone Packet<\u002Fa><a href=\"#action\"><span class=\"dot\"><\u002Fspan>Action Plan<\u002Fa><a class=\"sub\" href=\"#act18\"><span class=\"hnum\">18<\u002Fspan>Personal Action Plan<\u002Fa><a class=\"sub\" href=\"#act19\"><span class=\"hnum\">19<\u002Fspan>Accountability Partner<\u002Fa><a class=\"sub\" href=\"#act20\"><span class=\"hnum\">20<\u002Fspan>Final Commitment<\u002Fa>\n<\u002Fnav>\n<div class=\"progress\"><div style=\"display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px\"><span>Workbook progress<\u002Fspan><strong id=\"pct\">0%<\u002Fstrong><\u002Fdiv><div class=\"bar\"><span id=\"fill\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<p style=\"font-size:11.5px;color:#afd0de;line-height:1.45\">Entries save automatically in this browser. Use Download My Work before closing.<\u002Fp>\n<\u002Faside>\n<main class=\"main\">\n<section class=\"hero\" id=\"start\"><div class=\"k\">VILT Participant Workbook<\u002Fdiv><h2>Contributing to Team Success<\u002Fh2><p>Use this workbook to analyze team behavior, practice communication, make decisions, and turn the course into actions you can use at work.<\u002Fp><\u002Fsection>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Getting Started<\u002Fdiv><h3>How to Use This Workbook<\u002Fh3><p>Your instructor will reference activity titles. Keep this tab open throughout the session.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"g3\"><div class=\"mini\"><h4>Work here<\u002Fh4><p>Complete reflections and record breakout decisions.<\u002Fp><\u002Fdiv><div class=\"mini\"><h4>Work together<\u002Fh4><p>For group activities, one person may record the team response.<\u002Fp><\u002Fdiv><div class=\"mini\"><h4>Save your work<\u002Fh4><p>Download your completed HTML or print to PDF before you close the browser.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<div class=\"section\" id=\"behaviors\"><div class=\"k\">Section 1<\u002Fdiv><h2>Valuable Team Behaviors<\u002Fh2><p>What your team can see, hear, and rely on.<\u002Fp><\u002Fdiv>\n\n<section class=\"card\" id=\"act01\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Breakout Activity<\u002Fdiv><h3>Behavior Sort: What Builds Team Value?<\u002Fh3><p>Generate at least eight observable behaviors, sort them into four zones, then choose the highest-leverage behavior.<\u002Fp><\u002Fdiv><span class=\"badge\">GROUPS OF 3–5<\u002Fspan><\u002Fdiv>\n<div class=\"info orange\"><strong>Keep it behavioral.<\u002Fstrong> Instead of “reliable,” write something people can see or hear, such as “flags a delay before the deadline and proposes a next step.”<\u002Fdiv>\n<div class=\"zones\" id=\"behaviorZones\"><div class=\"zone\" data-zone=\"Communication\"><h4>Communication<\u002Fh4><\u002Fdiv><div class=\"zone\" data-zone=\"Reliability / Ownership\"><h4>Reliability / Ownership<\u002Fh4><\u002Fdiv><div class=\"zone\" data-zone=\"Collaboration / Support\"><h4>Collaboration / Support<\u002Fh4><\u002Fdiv><div class=\"zone\" data-zone=\"Adaptability / Growth\"><h4>Adaptability / Growth<\u002Fh4><\u002Fdiv><\u002Fdiv>\n<div class=\"g2\" style=\"margin-top:14px\"><div class=\"mini\"><label>Add a behavior<\u002Flabel><input id=\"newBehavior\" type=\"text\" placeholder=\"Example: Shares status before being asked\"><label>Place it in<\u002Flabel><select id=\"newZone\"><option>Communication<\u002Foption><option>Reliability / Ownership<\u002Foption><option>Collaboration / Support<\u002Foption><option>Adaptability / Growth<\u002Foption><\u002Fselect><button class=\"btn primary\" id=\"addBehavior\" type=\"button\" style=\"margin-top:9px\">Add Behavior<\u002Fbutton><\u002Fdiv><div class=\"mini\"><label>Highest-leverage behavior<\u002Flabel><textarea data-save=\"highest_leverage\" placeholder=\"Which behavior did your group choose, and why?\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act02\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Case Study<\u002Fdiv><h3>The Attitude Shift<\u002Fh3><p>Analyze how one person’s visible behavior changes the team around it.<\u002Fp><\u002Fdiv><span class=\"badge\">GROUPS OF 3–5<\u002Fspan><\u002Fdiv>\n<div class=\"info\"><strong>Scenario:<\u002Fstrong> A five-person team is preparing a client update. Early in the week, Jordan raises two risks and offers to help. After the manager changes the deadline, Jordan begins saying, “It does not matter, they will change it again.” Jordan stops volunteering status updates, responds to questions with short answers, and jokes that the project is “already doomed.” Within two days, two teammates stop raising issues because they expect sarcasm. Another waits until the last minute to report a data problem. The client update goes out with an avoidable error.<\u002Fdiv>\n<div class=\"g3\"><div class=\"mini\"><label>When did the team dynamic begin to shift?<\u002Flabel><textarea data-save=\"attitude_shift\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Which observable behaviors spread the effect?<\u002Flabel><textarea data-save=\"attitude_behaviors\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>What could a teammate have done earlier?<\u002Flabel><textarea data-save=\"attitude_intervention\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act03\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Reflection<\u002Fdiv><h3>One Behavior to Strengthen<\u002Fh3><p>Choose one behavior your team should experience more consistently from you.<\u002Fp><\u002Fdiv><\u002Fdiv><textarea data-save=\"behavior_strengthen\" placeholder=\"One behavior my team should experience more consistently from me is...\"><\u002Ftextarea><\u002Fsection>\n\n<div class=\"section\" id=\"contribution\"><div class=\"k\">Section 2<\u002Fdiv><h2>Contribution and Impact<\u002Fh2><p>What do I contribute, and what effect does it have?<\u002Fp><\u002Fdiv>\n\n<section class=\"card\" id=\"act04\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Activity<\u002Fdiv><h3>Contribution Map: Task, Team, Climate<\u002Fh3><p>Record one recent example under each lens.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"g3\"><div class=\"mini\"><h4>Task Contribution<\u002Fh4><p>The work product or deliverable.<\u002Fp><textarea data-save=\"contrib_task\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><h4>Team Contribution<\u002Fh4><p>How you help coordination, knowledge flow, and shared execution.<\u002Fp><textarea data-save=\"contrib_team\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><h4>Climate Contribution<\u002Fh4><p>How your behavior affects whether people can speak up, recover, and work through pressure.<\u002Fp><textarea data-save=\"contrib_climate\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act05\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Private Reflection<\u002Fdiv><h3>Guided Self-Reflection: The Last 90 Days<\u002Fh3><p>Use one specific project, shift, cycle, or recurring responsibility as your reference point.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"g2\"><div class=\"mini\"><label>One contribution I am proud of<\u002Flabel><textarea data-save=\"reflect_proud\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>One place my behavior created friction or extra work<\u002Flabel><textarea data-save=\"reflect_friction\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>One time I waited too long to communicate<\u002Flabel><textarea data-save=\"reflect_late\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>One behavior I want to repeat more consistently<\u002Flabel><textarea data-save=\"reflect_repeat\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act06\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Self-Assessment<\u002Fdiv><h3>Peer Expectations: The Unwritten Contract<\u002Fh3><p>Rate your current behavior privately. “Reasonable” response time depends on role, urgency, and team norms.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"table\"><table><thead><tr><th>Behavior<\u002Fth><th>Your rating<\u002Fth><th>Priority gap?<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td>Closes loops<\u002Ftd><td><select data-save=\"peer_close\"><option value=\"\">Select...<\u002Foption><option>Never<\u002Foption><option>Sometimes<\u002Foption><option>Often<\u002Foption><option>Consistently<\u002Foption><\u002Fselect><\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_close\"> Prioritize<\u002Flabel><\u002Ftd><\u002Ftr>\n<tr><td>Responds within a reasonable time<\u002Ftd><td><select data-save=\"peer_respond\"><option value=\"\">Select...<\u002Foption><option>Never<\u002Foption><option>Sometimes<\u002Foption><option>Often<\u002Foption><option>Consistently<\u002Foption><\u002Fselect><\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_respond\"> Prioritize<\u002Flabel><\u002Ftd><\u002Ftr>\n<tr><td>Raises blockers early<\u002Ftd><td><select data-save=\"peer_blockers\"><option value=\"\">Select...<\u002Foption><option>Never<\u002Foption><option>Sometimes<\u002Foption><option>Often<\u002Foption><option>Consistently<\u002Foption><\u002Fselect><\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_blockers\"> Prioritize<\u002Flabel><\u002Ftd><\u002Ftr>\n<tr><td>Meets quality expectations<\u002Ftd><td><select data-save=\"peer_quality\"><option value=\"\">Select...<\u002Foption><option>Never<\u002Foption><option>Sometimes<\u002Foption><option>Often<\u002Foption><option>Consistently<\u002Foption><\u002Fselect><\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_quality\"> Prioritize<\u002Flabel><\u002Ftd><\u002Ftr>\n<tr><td>Supports peers<\u002Ftd><td><select data-save=\"peer_support\"><option value=\"\">Select...<\u002Foption><option>Never<\u002Foption><option>Sometimes<\u002Foption><option>Often<\u002Foption><option>Consistently<\u002Foption><\u002Fselect><\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_support\"> Prioritize<\u002Flabel><\u002Ftd><\u002Ftr>\n<tr><td>Owns mistakes<\u002Ftd><td><select data-save=\"peer_mistakes\"><option value=\"\">Select...<\u002Foption><option>Never<\u002Foption><option>Sometimes<\u002Foption><option>Often<\u002Foption><option>Consistently<\u002Foption><\u002Fselect><\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_mistakes\"> Prioritize<\u002Flabel><\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv><div class=\"info orange\">Choose no more than two priority gaps. The goal is to identify where a small improvement would most help the team.<\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act07\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Breakout Pairs<\u002Fdiv><h3>Hidden Skills Exchange<\u002Fh3><p>Identify an underused skill and connect it to a real team need.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"g2\"><div class=\"mini\"><label>A skill or area of knowledge I use less than I could<\u002Flabel><textarea data-save=\"hidden_skill\" placeholder=\"Facilitation, spreadsheet automation, writing, process mapping, customer knowledge...\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>A current team problem it might help solve<\u002Flabel><textarea data-save=\"hidden_problem\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>My partner's suggested application<\u002Flabel><textarea data-save=\"hidden_application\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>One realistic way I could test this contribution<\u002Flabel><textarea data-save=\"hidden_test\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act08\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Commitment<\u002Fdiv><h3>Contribution Commitment<\u002Fh3><p>Turn reflection into one testable contribution.<\u002Fp><\u002Fdiv><\u002Fdiv><label>This week I will contribute by...<\u002Flabel><textarea data-save=\"contrib_commitment\"><\u002Ftextarea><label>...so that the team can...<\u002Flabel><textarea data-save=\"contrib_outcome\"><\u002Ftextarea><\u002Fsection>\n\n<div class=\"section\" id=\"trust\"><div class=\"k\">Section 3<\u002Fdiv><h2>Communication and Trust<\u002Fh2><p>Trust is built through what people can predict from us.<\u002Fp><\u002Fdiv>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Quick Reference<\u002Fdiv><h3>Trust Builders and Trust Breakers<\u002Fh3><p>Use these behaviors as the lens for the decision activity.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"g2\"><div class=\"mini\"><h4>Trust Builders<\u002Fh4><p>Consistency · empathy · reliability · transparency · keeping commitments · open communication<\u002Fp><\u002Fdiv><div class=\"mini\"><h4>Trust Breakers<\u002Fh4><p>Missed commitments · poor listening · lack of accountability · gossip · withholding information<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"trust-bank\"><div class=\"head\"><div><div class=\"k\">Interactive Backup Game<\u002Fdiv><h3>Trust Bank<\u002Fh3><p>Choose the response that best protects trust and the work. Each choice changes Trust and Team Friction.<\u002Fp><\u002Fdiv><span class=\"badge\">6 TEAM MOMENTS<\u002Fspan><\u002Fdiv>\n<div class=\"g2\"><div class=\"mini\"><div class=\"metric\"><strong>Trust<\u002Fstrong><div class=\"meter\"><span id=\"trustMeter\"><\u002Fspan><\u002Fdiv><strong id=\"trustScore\">50<\u002Fstrong><\u002Fdiv><div class=\"metric\"><strong>Team Friction<\u002Fstrong><div class=\"meter\"><span id=\"frictionMeter\"><\u002Fspan><\u002Fdiv><strong id=\"frictionScore\">50<\u002Fstrong><\u002Fdiv><div class=\"info orange\">Some choices cost more time now but reduce downstream friction. Others feel efficient in the moment but create extra work later.<\u002Fdiv><\u002Fdiv>\n<div class=\"mini\"><div id=\"gameScenarios\"><\u002Fdiv><div class=\"result\" id=\"gameResult\" aria-live=\"polite\">Choose a response to begin.<\u002Fdiv><div style=\"display:flex;gap:8px;align-items:center;margin-top:10px\"><button class=\"btn alt\" id=\"resetGame\" type=\"button\">Reset Game<\u002Fbutton><span id=\"gameProgress\" style=\"font-size:12px;color:var(--m)\">Moment 1 of 6<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"g2\" style=\"margin-top:14px\"><div class=\"mini\"><label>Which choice was hardest because both options had a cost?<\u002Flabel><textarea data-save=\"trust_hardest\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Where did the “fast” choice create more work later?<\u002Flabel><textarea data-save=\"trust_fastcost\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act10\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Triad Practice<\u002Fdiv><h3>Speaker, Listener, Observer<\u002Fh3><p>Rotate roles every four minutes. Use a provided scenario or a non-sensitive real work challenge.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"g3\"><div class=\"mini\"><h4>Speaker<\u002Fh4><p>Describe the work challenge clearly. Focus on context, not a long backstory.<\u002Fp><\u002Fdiv><div class=\"mini\"><h4>Listener<\u002Fh4><p>Listen without solving. Ask at least one clarifying question and use a confirmation statement.<\u002Fp><\u002Fdiv><div class=\"mini\"><h4>Observer<\u002Fh4><p>Watch only for observable behaviors on the rubric. Give behavioral feedback.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"info\"><strong>Optional work scenario:<\u002Fstrong> A teammate tells you they cannot finish a deliverable by the agreed time because a dependency arrived late. They are frustrated and unsure what to do next.<\u002Fdiv>\n<div class=\"table\"><table><thead><tr><th>Observer criterion<\u002Fth><th>Observed?<\u002Fth><th>Notes<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td>Did not interrupt<\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_interrupt\"> Yes<\u002Flabel><\u002Ftd><td><input type=\"text\" data-save=\"obs_interrupt_note\"><\u002Ftd><\u002Ftr>\n<tr><td>Paraphrased accurately<\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_para\"> Yes<\u002Flabel><\u002Ftd><td><input type=\"text\" data-save=\"obs_para_note\"><\u002Ftd><\u002Ftr>\n<tr><td>Asked a clarifying question<\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_question\"> Yes<\u002Flabel><\u002Ftd><td><input type=\"text\" data-save=\"obs_question_note\"><\u002Ftd><\u002Ftr>\n<tr><td>Checked the need before offering advice<\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_need\"> Yes<\u002Flabel><\u002Ftd><td><input type=\"text\" data-save=\"obs_need_note\"><\u002Ftd><\u002Ftr>\n<tr><td>Confirmed the next step<\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_confirm\"> Yes<\u002Flabel><\u002Ftd><td><input type=\"text\" data-save=\"obs_confirm_note\"><\u002Ftd><\u002Ftr>\n<tr><td>Tone stayed neutral<\u002Ftd><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_tone\"> Yes<\u002Flabel><\u002Ftd><td><input type=\"text\" data-save=\"obs_tone_note\"><\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act11\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Commitment<\u002Fdiv><h3>Trust Micro-Commitment<\u002Fh3><p>Choose one communication behavior that would make you more predictable to your team.<\u002Fp><\u002Fdiv><\u002Fdiv><textarea data-save=\"trust_commitment\" placeholder=\"One behavior that would make me more predictable to my team is...\"><\u002Ftextarea><\u002Fsection>\n\n<div class=\"section\" id=\"conflict\"><div class=\"k\">Section 4<\u002Fdiv><h2>Collaborative Conflict<\u002Fh2><p>Disagreement is information. Escalation is a choice.<\u002Fp><\u002Fdiv>\n\n<section class=\"card\" id=\"act12\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Breakout Role-Play<\u002Fdiv><h3>Resolve the Work, Not the Person<\u002Fh3><p>Use the four-step framework to move a real work problem forward.<\u002Fp><\u002Fdiv><span class=\"badge\">PAIRS<\u002Fspan><\u002Fdiv>\n<div class=\"g4\"><div class=\"mini\"><h4>1 · Shared outcome<\u002Fh4><p>What are both sides trying to protect?<\u002Fp><\u002Fdiv><div class=\"mini\"><h4>2 · Facts &amp; constraints<\u002Fh4><p>What is true? What limits the options?<\u002Fp><\u002Fdiv><div class=\"mini\"><h4>3 · Options<\u002Fh4><p>Generate at least two workable paths.<\u002Fp><\u002Fdiv><div class=\"mini\"><h4>4 · Confirm<\u002Fh4><p>Who will do what, and by when?<\u002Fp><\u002Fdiv><\u002Fdiv>\n<label>Choose a scenario<\u002Flabel><select data-save=\"conflict_scenario\"><option value=\"\">Select...<\u002Foption><option>Two departments disagree on who owns a handoff.<\u002Foption><option>A teammate repeatedly changes scope after work begins.<\u002Foption><option>A peer requests support but does not provide the information needed.<\u002Foption><option>Two people both believe their deadline should come first.<\u002Foption><\u002Fselect>\n<div class=\"g2\" style=\"margin-top:12px\"><div class=\"mini\"><label>Shared outcome<\u002Flabel><textarea data-save=\"conflict_outcome\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Facts and constraints<\u002Flabel><textarea data-save=\"conflict_facts\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Option 1<\u002Flabel><textarea data-save=\"conflict_opt1\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Option 2<\u002Flabel><textarea data-save=\"conflict_opt2\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><label>Agreement and ownership<\u002Flabel><textarea data-save=\"conflict_confirm\" placeholder=\"Who will do what next, and by when?\"><\u002Ftextarea><\u002Fsection>\n\n<section class=\"card\" id=\"act13\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Reflection<\u002Fdiv><h3>When I Feel Myself Getting Defensive...<\u002Fh3><p>Capture one conflict behavior to use deliberately.<\u002Fp><\u002Fdiv><\u002Fdiv><textarea data-save=\"conflict_reset\" placeholder=\"When I feel myself getting defensive, I will...\"><\u002Ftextarea><\u002Fsection>\n\n<div class=\"section\" id=\"ownership\"><div class=\"k\">Section 5<\u002Fdiv><h2>Ownership and Initiative<\u002Fh2><p>Ownership means protecting the outcome, not doing everything yourself.<\u002Fp><\u002Fdiv>\n\n<section class=\"card\" id=\"act14\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Individual Activity<\u002Fdiv><h3>Opportunity Scan: Where Could I Reduce Friction?<\u002Fh3><p>Identify current work, the friction around it, and one small action within your role.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"table\"><table><thead><tr><th>Current work<\u002Fth><th>Friction or unmet need<\u002Fth><th>Small action I can take<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td><textarea data-save=\"opp_work1\"><\u002Ftextarea><\u002Ftd><td><textarea data-save=\"opp_fric1\"><\u002Ftextarea><\u002Ftd><td><textarea data-save=\"opp_act1\"><\u002Ftextarea><\u002Ftd><\u002Ftr>\n<tr><td><textarea data-save=\"opp_work2\"><\u002Ftextarea><\u002Ftd><td><textarea data-save=\"opp_fric2\"><\u002Ftextarea><\u002Ftd><td><textarea data-save=\"opp_act2\"><\u002Ftextarea><\u002Ftd><\u002Ftr>\n<tr><td><textarea data-save=\"opp_work3\"><\u002Ftextarea><\u002Ftd><td><textarea data-save=\"opp_fric3\"><\u002Ftextarea><\u002Ftd><td><textarea data-save=\"opp_act3\"><\u002Ftextarea><\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act15\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Gamified Breakout<\u002Fdiv><h3>Ownership Auction<\u002Fh3><p>Your group has 10 initiative points. Invest them where the team gets the strongest return.<\u002Fp><\u002Fdiv><span class=\"score\" id=\"auctionTotal\">0 / 10 points<\u002Fspan><\u002Fdiv>\n<div class=\"auction\">\n<div><h4>Redesign a shared tracker<\u002Fh4><label>Points<\u002Flabel><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_tracker\"><\u002Fdiv>\n<div><h4>Volunteer for an extra meeting<\u002Fh4><label>Points<\u002Flabel><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_meeting\"><\u002Fdiv>\n<div><h4>Create a quick handoff checklist<\u002Fh4><label>Points<\u002Flabel><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_checklist\"><\u002Fdiv>\n<div><h4>Mentor a new teammate 20 minutes weekly<\u002Fh4><label>Points<\u002Flabel><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_mentor\"><\u002Fdiv>\n<div><h4>Build a dashboard nobody requested<\u002Fh4><label>Points<\u002Flabel><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_dashboard\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"g2\" style=\"margin-top:14px\"><div class=\"mini\"><label>Why did your top investment deserve the points?<\u002Flabel><textarea data-save=\"auction_why\" placeholder=\"Consider team value, effort, and risk of overstepping.\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Which option sounded impressive but created little team value?<\u002Flabel><textarea data-save=\"auction_low\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act16\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Decision Filter<\u002Fdiv><h3>Choose the Ownership Move<\u002Fh3><p>Select one realistic initiative from your Opportunity Scan and tighten it until you can begin within one week.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"g4\"><div class=\"mini\"><h4>Value to team<\u002Fh4><select data-save=\"own_value\"><option value=\"\">Rate...<\u002Foption><option>Low<\u002Foption><option>Medium<\u002Foption><option>High<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"mini\"><h4>Within my role<\u002Fh4><select data-save=\"own_role\"><option value=\"\">Select...<\u002Foption><option>Yes<\u002Foption><option>Mostly<\u002Foption><option>Need alignment first<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"mini\"><h4>Reasonable effort<\u002Fh4><select data-save=\"own_effort\"><option value=\"\">Select...<\u002Foption><option>Yes<\u002Foption><option>Needs to shrink<\u002Foption><option>Too large right now<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"mini\"><h4>Clear next step<\u002Fh4><select data-save=\"own_clear\"><option value=\"\">Select...<\u002Foption><option>Yes<\u002Foption><option>Needs clarification<\u002Foption><\u002Fselect><\u002Fdiv><\u002Fdiv>\n<label>My ownership move<\u002Flabel><textarea data-save=\"ownership_move\"><\u002Ftextarea><label>What could make this hard to follow through on?<\u002Flabel><textarea data-save=\"ownership_barrier\"><\u002Ftextarea><\u002Fsection>\n\n<div class=\"section\" id=\"phoenix\"><div class=\"k\">Capstone<\u002Fdiv><h2>Project Phoenix<\u002Fh2><p>Use the course skills together to protect the outcome and the team experience.<\u002Fp><\u002Fdiv>\n\n<section class=\"card\" id=\"act17\" \"=\"\"><div class=\"phoenix\"><div class=\"phxhead\"><h3 style=\"margin:0\">Project Phoenix · Initial Situation<\u002Fh3><p style=\"margin:5px 0 0;color:#dceef5\">Cross-functional launch due Friday at 3:00 p.m. Today is Wednesday morning.<\u002Fp><\u002Fdiv><div class=\"phxgrid\"><div><strong>Operations<\u002Fstrong><p>Launch execution and operational readiness.<\u002Fp><\u002Fdiv><div><strong>Customer Support<\u002Fstrong><p>Customer readiness. Current staffing gap.<\u002Fp><\u002Fdiv><div><strong>Finance<\u002Fstrong><p>Data and final numbers.<\u002Fp><\u002Fdiv><div><strong>Communications<\u002Fstrong><p>Needs final numbers by noon tomorrow.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"alert\"><strong>Current conditions:<\u002Fstrong> one data dependency is late, Customer Support has a staffing gap, Communications needs final numbers by noon tomorrow, and a senior stakeholder has asked for an additional feature.<\u002Fdiv><\u002Fsection>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Round 1<\u002Fdiv><h3>Build the Team Response<\u002Fh3><p>Establish priorities, ownership, and communication before the scenario changes.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"g2\"><div class=\"mini\"><label>Shared outcome<\u002Flabel><textarea data-save=\"phx_outcome\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Top two risks<\u002Flabel><textarea data-save=\"phx_risks\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Who needs communication?<\u002Flabel><textarea data-save=\"phx_comms\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>One ownership action<\u002Flabel><textarea data-save=\"phx_owner_action\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv>\n<label>Write one communication sentence exactly as your team would say or send it.<\u002Flabel><textarea data-save=\"phx_sentence\"><\u002Ftextarea><\u002Fsection>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Twist 1<\u002Fdiv><h3>The Missed Handoff<\u002Fh3><p>An avoidable error appears. Respond without turning accountability into blame.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"alert\"><strong>New information:<\u002Fstrong> Finance discovers the data file sent yesterday used the wrong version. Rework will take 90 minutes. Nobody is sure who approved the final file.<\u002Fdiv>\n<div class=\"g3\"><div class=\"mini\"><label>What do you communicate first?<\u002Flabel><textarea data-save=\"phx_handoff_first\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>One accountability sentence<\u002Flabel><textarea data-save=\"phx_accountability\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>One immediate process fix<\u002Flabel><textarea data-save=\"phx_processfix\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Twist 2<\u002Fdiv><h3>New Request, Same Deadline<\u002Fh3><p>Make the tradeoff visible when a high-visibility request competes with the launch.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"alert\"><strong>Stakeholder message:<\u002Fstrong> “Can we add a new reporting feature before Friday? Leadership would love it.” Operations says there is no capacity without risking launch.<\u002Fdiv>\n<div class=\"g3\"><div class=\"mini\"><label>Exact stakeholder response<\u002Flabel><textarea data-save=\"phx_stakeholder\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>What will the team protect?<\u002Flabel><textarea data-save=\"phx_protect\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>What changes, if anything?<\u002Flabel><textarea data-save=\"phx_changes\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Team Board<\u002Fdiv><h3>Make the Plan Visible<\u002Fh3><p>A person joining the team late should be able to understand what matters and who owns what.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"g2\"><div class=\"mini\"><label>Outcome<\u002Flabel><textarea data-save=\"board_outcome\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Today's priorities<\u002Flabel><textarea data-save=\"board_priorities\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Risks and owners<\u002Flabel><textarea data-save=\"board_risks\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Communication commitments<\u002Flabel><textarea data-save=\"board_comms\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Capstone Debrief<\u002Fdiv><h3>What Made the Team Stronger?<\u002Fh3><p>Capture what your team did that improved coordination, contribution, trust, and ownership.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"g2\"><div class=\"mini\"><label>Behavior: What improved the quality of your decisions?<\u002Flabel><textarea data-save=\"debrief_behavior\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Contribution: Who created value beyond an assigned task?<\u002Flabel><textarea data-save=\"debrief_contribution\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Communication: Where did trust matter?<\u002Flabel><textarea data-save=\"debrief_communication\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Ownership: What did you protect or improve?<\u002Flabel><textarea data-save=\"debrief_ownership\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<div class=\"section\" id=\"action\"><div class=\"k\">Action Plan<\u002Fdiv><h2>Carry the Work Back to Your Team<\u002Fh2><p>Turn the day into a few observable behaviors you can test.<\u002Fp><\u002Fdiv>\n\n<section class=\"card\" id=\"act18\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Personal Action Plan<\u002Fdiv><h3>Start, Stop, Strengthen<\u002Fh3><p>Consolidate what you learned into three realistic actions.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"g3\"><div class=\"mini\"><h4>Start<\u002Fh4><p>One behavior to begin.<\u002Fp><textarea data-save=\"plan_start\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><h4>Stop or Reduce<\u002Fh4><p>One habit that creates team friction.<\u002Fp><textarea data-save=\"plan_stop\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><h4>Continue or Strengthen<\u002Fh4><p>One behavior already helping the team.<\u002Fp><textarea data-save=\"plan_strengthen\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv>\n<div class=\"info orange\"><strong>Make it observable.<\u002Fstrong> “Communicate better” is vague. “Send a risk update as soon as a deadline is in doubt” is observable.<\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act19\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Accountability Partner<\u002Fdiv><h3>Pressure-Test One Commitment<\u002Fh3><p>Share one goal, name one likely barrier, and agree on one check-in date.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"g2\"><div class=\"mini\"><label>Commitment I will share<\u002Flabel><textarea data-save=\"account_goal\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Likely barrier<\u002Flabel><textarea data-save=\"account_barrier\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Partner's pressure-test question<\u002Flabel><textarea data-save=\"account_question\"><\u002Ftextarea><\u002Fdiv><div class=\"mini\"><label>Check-in date<\u002Flabel><input type=\"date\" data-save=\"account_date\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"card\" id=\"act20\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Final Commitment<\u002Fdiv><h3>What Should Your Team Experience From You?<\u002Fh3><p>Finish the sentence in one clear, behavioral statement.<\u002Fp><\u002Fdiv><\u002Fdiv><textarea data-save=\"final_commitment\" placeholder=\"Because I am on the team, people should be able to count on me to...\"><\u002Ftextarea><\u002Fsection>\n\n<div class=\"toolbar\"><span class=\"status\" id=\"saveStatus\">Saved locally<\u002Fspan><button class=\"btn alt\" id=\"downloadBtn\" type=\"button\">Download My Work<\u002Fbutton><button class=\"btn alt\" id=\"resetBtn\" type=\"button\">Clear Workbook<\u002Fbutton><button class=\"btn primary\" type=\"button\" onclick=\"window.print()\">Print / Save PDF<\u002Fbutton><\u002Fdiv>\n<div class=\"footer\">Contributing to Team Success · Participant eWorkbook · C² Technologies<\u002Fdiv>\n<\u002Fmain><\u002Fdiv>\n\n<script>\nconst KEY='c2_team_success_eworkbook_v1';let state={fields:{},behaviors:[]};try{state=JSON.parse(localStorage.getItem(KEY))||state}catch(e){}\nfunction save(){localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Saved locally';progress();auction()}\nfunction bind(){document.querySelectorAll('[data-save]').forEach(el=>{const k=el.dataset.save,v=state.fields[k];if(el.type==='checkbox')el.checked=!!v;else if(v!==undefined)el.value=v;const h=()=>{state.fields[k]=el.type==='checkbox'?el.checked:el.value;save()};el.addEventListener('input',h);el.addEventListener('change',h)})}\nfunction progress(){const keys=[...new Set([...document.querySelectorAll('[data-save]')].map(e=>e.dataset.save))];let done=keys.filter(k=>{const v=state.fields[k];return v===true||(v!==undefined&&String(v).trim()!=='')}).length;if(state.behaviors.length)done++;const pct=Math.round(done/(keys.length+1)*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%'}\nfunction renderBehaviors(){document.querySelectorAll('.zone .item').forEach(x=>x.remove());state.behaviors.forEach((b,i)=>{const z=[...document.querySelectorAll('.zone')].find(x=>x.dataset.zone===b.zone);if(!z)return;const w=document.createElement('div');w.className='item';const inp=document.createElement('input');inp.type='text';inp.value=b.text;inp.oninput=()=>{state.behaviors[i].text=inp.value;save()};const del=document.createElement('button');del.type='button';del.className='btn alt';del.textContent='×';del.onclick=()=>{state.behaviors.splice(i,1);renderBehaviors();save()};w.append(inp,del);z.append(w)})}\ndocument.getElementById('addBehavior').onclick=()=>{const txt=document.getElementById('newBehavior').value.trim();if(!txt)return;state.behaviors.push({text:txt,zone:document.getElementById('newZone').value});document.getElementById('newBehavior').value='';renderBehaviors();save()};\n\nconst moments=[\n[\"You realize you will miss a deadline.\",[\"Wait until the deadline and explain then.\",-12,15,\"Fast now, expensive later. The team loses time it could have used to adjust.\"],[\"Flag the risk early, explain what changed, and propose options.\",12,-10,\"Early transparency gives the team choices and protects predictability.\"]],\n[\"A teammate sends incomplete work that blocks your next step.\",[\"Fix it yourself without saying anything.\",2,8,\"The work may move, but the handoff problem stays invisible and may repeat.\"],[\"Clarify what is missing, explain the impact, and agree on the next handoff.\",9,-7,\"The conversation costs a few minutes now and reduces repeated friction.\"]],\n[\"A rumor is circulating about a team change.\",[\"Pass it along with a disclaimer that you are not sure it is true.\",-15,18,\"Unverified information increases uncertainty and makes trust harder to restore.\"],[\"Do not spread it. Direct questions to a reliable source or say you do not know.\",10,-10,\"Resisting the rumor protects information quality and team stability.\"]],\n[\"A customer issue exposes an error you made.\",[\"Focus first on the parts other people also contributed to.\",-10,13,\"Shared context matters, but deflecting ownership slows correction and damages predictability.\"],[\"State the error and impact, then move directly to the fix and what will prevent a repeat.\",14,-9,\"Ownership makes the problem easier to solve without turning accountability into blame.\"]],\n[\"A teammate asks for help when you are already at capacity.\",[\"Say yes and quietly absorb the extra work.\",1,12,\"Helpful intent can hide a capacity problem and create missed commitments later.\"],[\"Explain your capacity, ask what matters most, and offer a realistic option.\",10,-6,\"A boundary plus options supports the teammate without making an invisible promise.\"]],\n[\"A meeting ends with an unclear decision.\",[\"Assume everyone heard the same thing and move on.\",-7,11,\"Ambiguity feels efficient until people act on different assumptions.\"],[\"Confirm the decision, owner, and next step before the meeting closes.\",11,-10,\"A short confirmation reduces rework and protects follow-through.\"]]];\nlet gi=0,trust=50,friction=50,locked=false;\nfunction renderGame(){const h=document.getElementById('gameScenarios');h.innerHTML='';if(gi>=moments.length){h.innerHTML='<h4>Trust Bank complete<\u002Fh4><p>You worked through all six team moments.<\u002Fp>';document.getElementById('gameProgress').textContent='Complete';return}const m=moments[gi],q=document.createElement('h4');q.textContent=m[0];h.append(q);[m[1],m[2]].forEach((c,idx)=>{const b=document.createElement('button');b.type='button';b.className='gameChoice';b.textContent=c[0];b.onclick=()=>choose(idx);h.append(b)});document.getElementById('gameProgress').textContent=`Moment ${gi+1} of 6`;locked=false}\nfunction choose(idx){if(locked)return;locked=true;const c=moments[gi][idx+1];trust=Math.max(0,Math.min(100,trust+c[1]));friction=Math.max(0,Math.min(100,friction+c[2]));document.getElementById('trustScore').textContent=trust;document.getElementById('frictionScore').textContent=friction;document.getElementById('trustMeter').style.width=trust+'%';document.getElementById('frictionMeter').style.width=friction+'%';document.getElementById('gameResult').textContent=c[3];setTimeout(()=>{gi++;renderGame()},800)}\ndocument.getElementById('resetGame').onclick=()=>{gi=0;trust=50;friction=50;document.getElementById('trustScore').textContent=50;document.getElementById('frictionScore').textContent=50;document.getElementById('trustMeter').style.width='50%';document.getElementById('frictionMeter').style.width='50%';document.getElementById('gameResult').textContent='Choose a response to begin.';renderGame()};\nfunction auction(){const total=[...document.querySelectorAll('.auctionInput')].reduce((s,e)=>s+Number(e.value||0),0),el=document.getElementById('auctionTotal');el.textContent=total+' / 10 points';el.classList.toggle('over',total>10)}\nfunction download(){const clone=document.documentElement.cloneNode(true);clone.querySelectorAll('[data-save]').forEach(el=>{const v=state.fields[el.dataset.save];if(el.tagName==='TEXTAREA')el.textContent=v||'';else if(el.tagName==='SELECT')[...el.options].forEach(o=>{if(o.value===v||o.text===v)o.setAttribute('selected','selected');else o.removeAttribute('selected')});else if(el.type==='checkbox'){if(v)el.setAttribute('checked','checked');else el.removeAttribute('checked')}else el.setAttribute('value',v||'')});const blob=new Blob(['<!DOCTYPE html>\\n'+clone.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Contributing_to_Team_Success_My_Work.html';document.body.appendChild(a);a.click();a.remove()}\ndocument.getElementById('downloadBtn').onclick=download;document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear all workbook entries?')){localStorage.removeItem(KEY);location.reload()}};\nconst links=[...document.querySelectorAll('.nav a')],targets=links.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.remove('active'));const a=links.find(x=>document.querySelector(x.getAttribute('href'))===e.target);if(a)a.classList.add('active')}}),{rootMargin:'-30% 0px -60% 0px'}).observe;\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const a=links.find(x=>document.querySelector(x.getAttribute('href'))===e.target);if(!a)return;links.forEach(x=>x.classList.remove('active','group-current'));a.classList.add('active');let g=a;while(g&&g.classList.contains('sub'))g=g.previousElementSibling;if(g&&g!==a)g.classList.add('group-current');const sb=document.querySelector('.side'),r=a.getBoundingClientRect(),sr=sb.getBoundingClientRect();if(getComputedStyle(sb).position==='sticky'&&(r.top<sr.top+80||r.bottom>sr.bottom-40))sb.scrollTop+=r.top-sr.top-sr.height/3}}),{rootMargin:'-30% 0px -60% 0px'});targets.forEach(t=>io.observe(t));\nbind();renderBehaviors();renderGame();auction();progress();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
