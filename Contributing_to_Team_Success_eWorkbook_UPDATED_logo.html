  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"#action\"><span class=\"dot\"></span>Action Plan</a><a class=\"sub\" href=\"#act18\"><span class=\"hnum\">18</span>Personal Action Plan</a><a class=\"sub\" href=\"#act19\"><span class=\"hnum\">19</span>Accountability Partner</a><a class=\"sub\" href=\"#act20\"><span class=\"hnum\">20</span>Final Commitment</a>\n</nav>\n<div class=\"progress\"><div style=\"display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px\"><span>Workbook progress</span><strong id=\"pct\">0%</strong></div><div class=\"bar\"><span id=\"fill\"></span></div></div>\n<p style=\"font-size:11.5px;color:#afd0de;line-height:1.45\">Entries save automatically in this browser. Use Download My Work before closing.</p>\n</aside>\n<main class=\"main\">\n<section class=\"hero\" id=\"start\"><div class=\"k\">VILT Participant Workbook</div><h2>Contributing to Team Success</h2><p>Use this workbook to analyze team behavior, practice communication, make decisions, and turn the course into actions you can use at work.</p></section>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Getting Started</div><h3>How to Use This Workbook</h3><p>Your instructor will reference activity titles. Keep this tab open throughout the session.</p></div></div><div class=\"g3\"><div class=\"mini\"><h4>Work here</h4><p>Complete reflections and record breakout decisions.</p></div><div class=\"mini\"><h4>Work together</h4><p>For group activities, one person may record the team response.</p></div><div class=\"mini\"><h4>Save your work</h4><p>Download your completed HTML or print to PDF before you close the browser.</p></div></div></section>\n\n<div class=\"section\" id=\"behaviors\"><div class=\"k\">Section 1</div><h2>Valuable Team Behaviors</h2><p>What your team can see, hear, and rely on.</p></div>\n\n<section class=\"card\" id=\"act01\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Breakout Activity</div><h3>Behavior Sort: What Builds Team Value?</h3><p>Generate at least eight observable behaviors, sort them into four zones, then choose the highest-leverage behavior.</p></div><span class=\"badge\">GROUPS OF 3–5</span></div>\n<div class=\"info orange\"><strong>Keep it behavioral.</strong> Instead of “reliable,” write something people can see or hear, such as “flags a delay before the deadline and proposes a next step.”</div>\n<div class=\"zones\" id=\"behaviorZones\"><div class=\"zone\" data-zone=\"Communication\"><h4>Communication</h4></div><div class=\"zone\" data-zone=\"Reliability / Ownership\"><h4>Reliability / Ownership</h4></div><div class=\"zone\" data-zone=\"Collaboration / Support\"><h4>Collaboration / Support</h4></div><div class=\"zone\" data-zone=\"Adaptability / Growth\"><h4>Adaptability / Growth</h4></div></div>\n<div class=\"g2\" style=\"margin-top:14px\"><div class=\"mini\"><label>Add a behavior</label><input id=\"newBehavior\" type=\"text\" placeholder=\"Example: Shares status before being asked\"><label>Place it in</label><select id=\"newZone\"><option>Communication</option><option>Reliability / Ownership</option><option>Collaboration / Support</option><option>Adaptability / Growth</option></select><button class=\"btn primary\" id=\"addBehavior\" type=\"button\" style=\"margin-top:9px\">Add Behavior</button></div><div class=\"mini\"><label>Highest-leverage behavior</label><textarea data-save=\"highest_leverage\" placeholder=\"Which behavior did your group choose, and why?\"></textarea></div></div></section>\n\n<section class=\"card\" id=\"act02\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Case Study</div><h3>The Attitude Shift</h3><p>Analyze how one person’s visible behavior changes the team around it.</p></div><span class=\"badge\">GROUPS OF 3–5</span></div>\n<div class=\"info\"><strong>Scenario:</strong> A five-person team is preparing a client update. Early in the week, Jordan raises two risks and offers to help. After the manager changes the deadline, Jordan begins saying, “It does not matter, they will change it again.” Jordan stops volunteering status updates, responds to questions with short answers, and jokes that the project is “already doomed.” Within two days, two teammates stop raising issues because they expect sarcasm. Another waits until the last minute to report a data problem. The client update goes out with an avoidable error.</div>\n<div class=\"g3\"><div class=\"mini\"><label>When did the team dynamic begin to shift?</label><textarea data-save=\"attitude_shift\"></textarea></div><div class=\"mini\"><label>Which observable behaviors spread the effect?</label><textarea data-save=\"attitude_behaviors\"></textarea></div><div class=\"mini\"><label>What could a teammate have done earlier?</label><textarea data-save=\"attitude_intervention\"></textarea></div></div></section>\n\n<section class=\"card\" id=\"act03\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Reflection</div><h3>One Behavior to Strengthen</h3><p>Choose one behavior your team should experience more consistently from you.</p></div></div><textarea data-save=\"behavior_strengthen\" placeholder=\"One behavior my team should experience more consistently from me is...\"></textarea></section>\n\n<div class=\"section\" id=\"contribution\"><div class=\"k\">Section 2</div><h2>Contribution and Impact</h2><p>What do I contribute, and what effect does it have?</p></div>\n\n<section class=\"card\" id=\"act04\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Activity</div><h3>Contribution Map: Task, Team, Climate</h3><p>Record one recent example under each lens.</p></div></div><div class=\"g3\"><div class=\"mini\"><h4>Task Contribution</h4><p>The work product or deliverable.</p><textarea data-save=\"contrib_task\"></textarea></div><div class=\"mini\"><h4>Team Contribution</h4><p>How you help coordination, knowledge flow, and shared execution.</p><textarea data-save=\"contrib_team\"></textarea></div><div class=\"mini\"><h4>Climate Contribution</h4><p>How your behavior affects whether people can speak up, recover, and work through pressure.</p><textarea data-save=\"contrib_climate\"></textarea></div></div></section>\n\n<section class=\"card\" id=\"act05\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Private Reflection</div><h3>Guided Self-Reflection: The Last 90 Days</h3><p>Use one specific project, shift, cycle, or recurring responsibility as your reference point.</p></div></div><div class=\"g2\"><div class=\"mini\"><label>One contribution I am proud of</label><textarea data-save=\"reflect_proud\"></textarea></div><div class=\"mini\"><label>One place my behavior created friction or extra work</label><textarea data-save=\"reflect_friction\"></textarea></div><div class=\"mini\"><label>One time I waited too long to communicate</label><textarea data-save=\"reflect_late\"></textarea></div><div class=\"mini\"><label>One behavior I want to repeat more consistently</label><textarea data-save=\"reflect_repeat\"></textarea></div></div></section>\n\n<section class=\"card\" id=\"act06\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Self-Assessment</div><h3>Peer Expectations: The Unwritten Contract</h3><p>Rate your current behavior privately. “Reasonable” response time depends on role, urgency, and team norms.</p></div></div>\n<div class=\"table\"><table><thead><tr><th>Behavior</th><th>Your rating</th><th>Priority gap?</th></tr></thead><tbody>\n<tr><td>Closes loops</td><td><select data-save=\"peer_close\"><option value=\"\">Select...</option><option>Never</option><option>Sometimes</option><option>Often</option><option>Consistently</option></select></td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_close\"> Prioritize</label></td></tr>\n<tr><td>Responds within a reasonable time</td><td><select data-save=\"peer_respond\"><option value=\"\">Select...</option><option>Never</option><option>Sometimes</option><option>Often</option><option>Consistently</option></select></td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_respond\"> Prioritize</label></td></tr>\n<tr><td>Raises blockers early</td><td><select data-save=\"peer_blockers\"><option value=\"\">Select...</option><option>Never</option><option>Sometimes</option><option>Often</option><option>Consistently</option></select></td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_blockers\"> Prioritize</label></td></tr>\n<tr><td>Meets quality expectations</td><td><select data-save=\"peer_quality\"><option value=\"\">Select...</option><option>Never</option><option>Sometimes</option><option>Often</option><option>Consistently</option></select></td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_quality\"> Prioritize</label></td></tr>\n<tr><td>Supports peers</td><td><select data-save=\"peer_support\"><option value=\"\">Select...</option><option>Never</option><option>Sometimes</option><option>Often</option><option>Consistently</option></select></td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_support\"> Prioritize</label></td></tr>\n<tr><td>Owns mistakes</td><td><select data-save=\"peer_mistakes\"><option value=\"\">Select...</option><option>Never</option><option>Sometimes</option><option>Often</option><option>Consistently</option></select></td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"gap_mistakes\"> Prioritize</label></td></tr>\n</tbody></table></div><div class=\"info orange\">Choose no more than two priority gaps. The goal is to identify where a small improvement would most help the team.</div></section>\n\n<section class=\"card\" id=\"act07\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Breakout Pairs</div><h3>Hidden Skills Exchange</h3><p>Identify an underused skill and connect it to a real team need.</p></div></div>\n<div class=\"g2\"><div class=\"mini\"><label>A skill or area of knowledge I use less than I could</label><textarea data-save=\"hidden_skill\" placeholder=\"Facilitation, spreadsheet automation, writing, process mapping, customer knowledge...\"></textarea></div><div class=\"mini\"><label>A current team problem it might help solve</label><textarea data-save=\"hidden_problem\"></textarea></div><div class=\"mini\"><label>My partner's suggested application</label><textarea data-save=\"hidden_application\"></textarea></div><div class=\"mini\"><label>One realistic way I could test this contribution</label><textarea data-save=\"hidden_test\"></textarea></div></div></section>\n\n<section class=\"card\" id=\"act08\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Commitment</div><h3>Contribution Commitment</h3><p>Turn reflection into one testable contribution.</p></div></div><label>This week I will contribute by...</label><textarea data-save=\"contrib_commitment\"></textarea><label>...so that the team can...</label><textarea data-save=\"contrib_outcome\"></textarea></section>\n\n<div class=\"section\" id=\"trust\"><div class=\"k\">Section 3</div><h2>Communication and Trust</h2><p>Trust is built through what people can predict from us.</p></div>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Quick Reference</div><h3>Trust Builders and Trust Breakers</h3><p>Use these behaviors as the lens for the decision activity.</p></div></div><div class=\"g2\"><div class=\"mini\"><h4>Trust Builders</h4><p>Consistency · empathy · reliability · transparency · keeping commitments · open communication</p></div><div class=\"mini\"><h4>Trust Breakers</h4><p>Missed commitments · poor listening · lack of accountability · gossip · withholding information</p></div></div></section>\n\n<section class=\"card\" id=\"trust-bank\"><div class=\"head\"><div><div class=\"k\">Interactive Backup Game</div><h3>Trust Bank</h3><p>Choose the response you would make. Each option carries a different tradeoff, and every choice affects Trust and Team Friction.</p></div><span class=\"badge\">6 TEAM MOMENTS</span></div>\n<div class=\"tb-wrap\">\n  <div class=\"tb-meters\">\n    <div class=\"tb-meterBlock\"><div class=\"tb-meterLabel\"><strong>Trust</strong><strong id=\"trustScore\">50</strong></div><div class=\"tb-meter\"><span class=\"tb-trust\" id=\"trustMeter\"></span></div></div>\n    <div class=\"tb-meterBlock\"><div class=\"tb-meterLabel\"><strong>Team Friction</strong><strong id=\"frictionScore\">50</strong></div><div class=\"tb-meter\"><span class=\"tb-friction\" id=\"frictionMeter\"></span></div></div>\n  </div>\n  <div class=\"tb-stage\">\n    <div class=\"tb-progressRow\"><span id=\"gameProgress\">Moment 1 of 6</span><div class=\"tb-pills\" id=\"gamePills\" aria-hidden=\"true\"></div></div>\n    <div id=\"gameScenarios\"></div>\n    <div class=\"tb-consequence\" id=\"gameResult\" aria-live=\"polite\" hidden></div>\n    <div class=\"tb-nextRow\"><button class=\"btn primary\" id=\"nextGameMoment\" type=\"button\" hidden>Next Team Moment</button><button class=\"btn alt\" id=\"resetGame\" type=\"button\">Reset Game</button></div>\n  </div>\n</div>\n<div class=\"g2\" style=\"margin-top:14px\"><div class=\"mini\"><label>Which choice was hardest because both options had a cost?</label><textarea data-save=\"trust_hardest\"></textarea></div><div class=\"mini\"><label>Where did the “fast” choice create more work later?</label><textarea data-save=\"trust_fastcost\"></textarea></div></div></section>\n\n<section class=\"card\" id=\"act10\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Triad Practice</div><h3>Speaker, Listener, Observer</h3><p>Rotate roles every four minutes. Use a provided scenario or a non-sensitive real work challenge.</p></div></div>\n<div class=\"g3\"><div class=\"mini\"><h4>Speaker</h4><p>Describe the work challenge clearly. Focus on context, not a long backstory.</p></div><div class=\"mini\"><h4>Listener</h4><p>Listen without solving. Ask at least one clarifying question and use a confirmation statement.</p></div><div class=\"mini\"><h4>Observer</h4><p>Watch only for observable behaviors on the rubric. Give behavioral feedback.</p></div></div>\n<div class=\"info\"><strong>Optional work scenario:</strong> A teammate tells you they cannot finish a deliverable by the agreed time because a dependency arrived late. They are frustrated and unsure what to do next.</div>\n<div class=\"table\"><table><thead><tr><th>Observer criterion</th><th>Observed?</th><th>Notes</th></tr></thead><tbody>\n<tr><td>Did not interrupt</td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_interrupt\"> Yes</label></td><td><input type=\"text\" data-save=\"obs_interrupt_note\"></td></tr>\n<tr><td>Paraphrased accurately</td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_para\"> Yes</label></td><td><input type=\"text\" data-save=\"obs_para_note\"></td></tr>\n<tr><td>Asked a clarifying question</td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_question\"> Yes</label></td><td><input type=\"text\" data-save=\"obs_question_note\"></td></tr>\n<tr><td>Checked the need before offering advice</td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_need\"> Yes</label></td><td><input type=\"text\" data-save=\"obs_need_note\"></td></tr>\n<tr><td>Confirmed the next step</td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_confirm\"> Yes</label></td><td><input type=\"text\" data-save=\"obs_confirm_note\"></td></tr>\n<tr><td>Tone stayed neutral</td><td><label class=\"choice\"><input type=\"checkbox\" data-save=\"obs_tone\"> Yes</label></td><td><input type=\"text\" data-save=\"obs_tone_note\"></td></tr>\n</tbody></table></div></section>\n\n<section class=\"card\" id=\"act11\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Commitment</div><h3>Trust Micro-Commitment</h3><p>Choose one communication behavior that would make you more predictable to your team.</p></div></div><textarea data-save=\"trust_commitment\" placeholder=\"One behavior that would make me more predictable to my team is...\"></textarea></section>\n\n<div class=\"section\" id=\"conflict\"><div class=\"k\">Section 4</div><h2>Collaborative Conflict</h2><p>Disagreement is information. Escalation is a choice.</p></div>\n\n<section class=\"card\" id=\"act12\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Breakout Role-Play</div><h3>Resolve the Work, Not the Person</h3><p>Use the four-step framework to move a real work problem forward.</p></div><span class=\"badge\">PAIRS</span></div>\n<div class=\"g4\"><div class=\"mini\"><h4>1 · Shared outcome</h4><p>What are both sides trying to protect?</p></div><div class=\"mini\"><h4>2 · Facts &amp; constraints</h4><p>What is true? What limits the options?</p></div><div class=\"mini\"><h4>3 · Options</h4><p>Generate at least two workable paths.</p></div><div class=\"mini\"><h4>4 · Confirm</h4><p>Who will do what, and by when?</p></div></div>\n<label>Choose a scenario</label><select data-save=\"conflict_scenario\"><option value=\"\">Select...</option><option>Two departments disagree on who owns a handoff.</option><option>A teammate repeatedly changes scope after work begins.</option><option>A peer requests support but does not provide the information needed.</option><option>Two people both believe their deadline should come first.</option></select>\n<div class=\"g2\" style=\"margin-top:12px\"><div class=\"mini\"><label>Shared outcome</label><textarea data-save=\"conflict_outcome\"></textarea></div><div class=\"mini\"><label>Facts and constraints</label><textarea data-save=\"conflict_facts\"></textarea></div><div class=\"mini\"><label>Option 1</label><textarea data-save=\"conflict_opt1\"></textarea></div><div class=\"mini\"><label>Option 2</label><textarea data-save=\"conflict_opt2\"></textarea></div></div><label>Agreement and ownership</label><textarea data-save=\"conflict_confirm\" placeholder=\"Who will do what next, and by when?\"></textarea></section>\n\n<section class=\"card\" id=\"act13\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Reflection</div><h3>When I Feel Myself Getting Defensive...</h3><p>Capture one conflict behavior to use deliberately.</p></div></div><textarea data-save=\"conflict_reset\" placeholder=\"When I feel myself getting defensive, I will...\"></textarea></section>\n\n<div class=\"section\" id=\"ownership\"><div class=\"k\">Section 5</div><h2>Ownership and Initiative</h2><p>Ownership means protecting the outcome, not doing everything yourself.</p></div>\n\n<section class=\"card\" id=\"act14\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Individual Activity</div><h3>Opportunity Scan: Where Could I Reduce Friction?</h3><p>Identify current work, the friction around it, and one small action within your role.</p></div></div>\n<div class=\"table\"><table><thead><tr><th>Current work</th><th>Friction or unmet need</th><th>Small action I can take</th></tr></thead><tbody>\n<tr><td><textarea data-save=\"opp_work1\"></textarea></td><td><textarea data-save=\"opp_fric1\"></textarea></td><td><textarea data-save=\"opp_act1\"></textarea></td></tr>\n<tr><td><textarea data-save=\"opp_work2\"></textarea></td><td><textarea data-save=\"opp_fric2\"></textarea></td><td><textarea data-save=\"opp_act2\"></textarea></td></tr>\n<tr><td><textarea data-save=\"opp_work3\"></textarea></td><td><textarea data-save=\"opp_fric3\"></textarea></td><td><textarea data-save=\"opp_act3\"></textarea></td></tr>\n</tbody></table></div></section>\n\n<section class=\"card\" id=\"act15\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Gamified Breakout</div><h3>Ownership Auction</h3><p>Your group has 10 initiative points. Invest them where the team gets the strongest return.</p></div><span class=\"score\" id=\"auctionTotal\">0 / 10 points</span></div>\n<div class=\"auction\">\n<div><h4>Redesign a shared tracker</h4><label>Points</label><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_tracker\"></div>\n<div><h4>Volunteer for an extra meeting</h4><label>Points</label><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_meeting\"></div>\n<div><h4>Create a quick handoff checklist</h4><label>Points</label><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_checklist\"></div>\n<div><h4>Mentor a new teammate 20 minutes weekly</h4><label>Points</label><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_mentor\"></div>\n<div><h4>Build a dashboard nobody requested</h4><label>Points</label><input class=\"auctionInput\" type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-save=\"auction_dashboard\"></div>\n</div>\n<div class=\"g2\" style=\"margin-top:14px\"><div class=\"mini\"><label>Why did your top investment deserve the points?</label><textarea data-save=\"auction_why\" placeholder=\"Consider team value, effort, and risk of overstepping.\"></textarea></div><div class=\"mini\"><label>Which option sounded impressive but created little team value?</label><textarea data-save=\"auction_low\"></textarea></div></div></section>\n\n<section class=\"card\" id=\"act16\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Decision Filter</div><h3>Choose the Ownership Move</h3><p>Select one realistic initiative from your Opportunity Scan and tighten it until you can begin within one week.</p></div></div>\n<div class=\"g4\"><div class=\"mini\"><h4>Value to team</h4><select data-save=\"own_value\"><option value=\"\">Rate...</option><option>Low</option><option>Medium</option><option>High</option></select></div><div class=\"mini\"><h4>Within my role</h4><select data-save=\"own_role\"><option value=\"\">Select...</option><option>Yes</option><option>Mostly</option><option>Need alignment first</option></select></div><div class=\"mini\"><h4>Reasonable effort</h4><select data-save=\"own_effort\"><option value=\"\">Select...</option><option>Yes</option><option>Needs to shrink</option><option>Too large right now</option></select></div><div class=\"mini\"><h4>Clear next step</h4><select data-save=\"own_clear\"><option value=\"\">Select...</option><option>Yes</option><option>Needs clarification</option></select></div></div>\n<label>My ownership move</label><textarea data-save=\"ownership_move\"></textarea><label>What could make this hard to follow through on?</label><textarea data-save=\"ownership_barrier\"></textarea></section>\n\n<div class=\"section\" id=\"phoenix\"><div class=\"k\">Capstone</div><h2>Project Phoenix</h2><p>Use the course skills together to protect the outcome and the team experience.</p></div>\n\n<section class=\"card\" id=\"act17\" \"=\"\"><div class=\"phoenix\"><div class=\"phxhead\"><h3 style=\"margin:0\">Project Phoenix · Initial Situation</h3><p style=\"margin:5px 0 0;color:#dceef5\">Cross-functional launch due Friday at 3:00 p.m. Today is Wednesday morning.</p></div><div class=\"phxgrid\"><div><strong>Operations</strong><p>Launch execution and operational readiness.</p></div><div><strong>Customer Support</strong><p>Customer readiness. Current staffing gap.</p></div><div><strong>Finance</strong><p>Data and final numbers.</p></div><div><strong>Communications</strong><p>Needs final numbers by noon tomorrow.</p></div></div></div>\n<div class=\"alert\"><strong>Current conditions:</strong> one data dependency is late, Customer Support has a staffing gap, Communications needs final numbers by noon tomorrow, and a senior stakeholder has asked for an additional feature.</div></section>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Round 1</div><h3>Build the Team Response</h3><p>Establish priorities, ownership, and communication before the scenario changes.</p></div></div>\n<div class=\"g2\"><div class=\"mini\"><label>Shared outcome</label><textarea data-save=\"phx_outcome\"></textarea></div><div class=\"mini\"><label>Top two risks</label><textarea data-save=\"phx_risks\"></textarea></div><div class=\"mini\"><label>Who needs communication?</label><textarea data-save=\"phx_comms\"></textarea></div><div class=\"mini\"><label>One ownership action</label><textarea data-save=\"phx_owner_action\"></textarea></div></div>\n<label>Write one communication sentence exactly as your team would say or send it.</label><textarea data-save=\"phx_sentence\"></textarea></section>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Twist 1</div><h3>The Missed Handoff</h3><p>An avoidable error appears. Respond without turning accountability into blame.</p></div></div>\n<div class=\"alert\"><strong>New information:</strong> Finance discovers the data file sent yesterday used the wrong version. Rework will take 90 minutes. Nobody is sure who approved the final file.</div>\n<div class=\"g3\"><div class=\"mini\"><label>What do you communicate first?</label><textarea data-save=\"phx_handoff_first\"></textarea></div><div class=\"mini\"><label>One accountability sentence</label><textarea data-save=\"phx_accountability\"></textarea></div><div class=\"mini\"><label>One immediate process fix</label><textarea data-save=\"phx_processfix\"></textarea></div></div></section>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Twist 2</div><h3>New Request, Same Deadline</h3><p>Make the tradeoff visible when a high-visibility request competes with the launch.</p></div></div>\n<div class=\"alert\"><strong>Stakeholder message:</strong> “Can we add a new reporting feature before Friday? Leadership would love it.” Operations says there is no capacity without risking launch.</div>\n<div class=\"g3\"><div class=\"mini\"><label>Exact stakeholder response</label><textarea data-save=\"phx_stakeholder\"></textarea></div><div class=\"mini\"><label>What will the team protect?</label><textarea data-save=\"phx_protect\"></textarea></div><div class=\"mini\"><label>What changes, if anything?</label><textarea data-save=\"phx_changes\"></textarea></div></div></section>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Team Board</div><h3>Make the Plan Visible</h3><p>A person joining the team late should be able to understand what matters and who owns what.</p></div></div><div class=\"g2\"><div class=\"mini\"><label>Outcome</label><textarea data-save=\"board_outcome\"></textarea></div><div class=\"mini\"><label>Today's priorities</label><textarea data-save=\"board_priorities\"></textarea></div><div class=\"mini\"><label>Risks and owners</label><textarea data-save=\"board_risks\"></textarea></div><div class=\"mini\"><label>Communication commitments</label><textarea data-save=\"board_comms\"></textarea></div></div></section>\n\n<section class=\"card\"><div class=\"head\"><div><div class=\"k\">Capstone Debrief</div><h3>What Made the Team Stronger?</h3><p>Capture what your team did that improved coordination, contribution, trust, and ownership.</p></div></div>\n<div class=\"g2\"><div class=\"mini\"><label>Behavior: What improved the quality of your decisions?</label><textarea data-save=\"debrief_behavior\"></textarea></div><div class=\"mini\"><label>Contribution: Who created value beyond an assigned task?</label><textarea data-save=\"debrief_contribution\"></textarea></div><div class=\"mini\"><label>Communication: Where did trust matter?</label><textarea data-save=\"debrief_communication\"></textarea></div><div class=\"mini\"><label>Ownership: What did you protect or improve?</label><textarea data-save=\"debrief_ownership\"></textarea></div></div></section>\n\n<div class=\"section\" id=\"action\"><div class=\"k\">Action Plan</div><h2>Carry the Work Back to Your Team</h2><p>Turn the day into a few observable behaviors you can test.</p></div>\n\n<section class=\"card\" id=\"act18\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Personal Action Plan</div><h3>Start, Stop, Strengthen</h3><p>Consolidate what you learned into three realistic actions.</p></div></div>\n<div class=\"g3\"><div class=\"mini\"><h4>Start</h4><p>One behavior to begin.</p><textarea data-save=\"plan_start\"></textarea></div><div class=\"mini\"><h4>Stop or Reduce</h4><p>One habit that creates team friction.</p><textarea data-save=\"plan_stop\"></textarea></div><div class=\"mini\"><h4>Continue or Strengthen</h4><p>One behavior already helping the team.</p><textarea data-save=\"plan_strengthen\"></textarea></div></div>\n<div class=\"info orange\"><strong>Make it observable.</strong> “Communicate better” is vague. “Send a risk update as soon as a deadline is in doubt” is observable.</div></section>\n\n<section class=\"card\" id=\"act19\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Accountability Partner</div><h3>Pressure-Test One Commitment</h3><p>Share one goal, name one likely barrier, and agree on one check-in date.</p></div></div><div class=\"g2\"><div class=\"mini\"><label>Commitment I will share</label><textarea data-save=\"account_goal\"></textarea></div><div class=\"mini\"><label>Likely barrier</label><textarea data-save=\"account_barrier\"></textarea></div><div class=\"mini\"><label>Partner's pressure-test question</label><textarea data-save=\"account_question\"></textarea></div><div class=\"mini\"><label>Check-in date</label><input type=\"date\" data-save=\"account_date\"></div></div></section>\n\n<section class=\"card\" id=\"act20\" \"=\"\"><div class=\"head\"><div><div class=\"k\">Final Commitment</div><h3>What Should Your Team Experience From You?</h3><p>Finish the sentence in one clear, behavioral statement.</p></div></div><textarea data-save=\"final_commitment\" placeholder=\"Because I am on the team, people should be able to count on me to...\"></textarea></section>\n\n<div class=\"toolbar\"><span class=\"status\" id=\"saveStatus\">Saved locally</span><button class=\"btn alt\" id=\"downloadBtn\" type=\"button\">Download My Work</button><button class=\"btn alt\" id=\"resetBtn\" type=\"button\">Clear Workbook</button><button class=\"btn primary\" type=\"button\" onclick=\"window.print()\">Print / Save PDF</button></div>\n<div class=\"footer\">Contributing to Team Success · Participant eWorkbook · C² Technologies</div>\n</main></div>\n\n<script>\nconst KEY='c2_team_success_eworkbook_v1';let state={fields:{},behaviors:[]};try{state=JSON.parse(localStorage.getItem(KEY))||state}catch(e){}\nfunction save(){localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Saved locally';progress();auction()}\nfunction bind(){document.querySelectorAll('[data-save]').forEach(el=>{const k=el.dataset.save,v=state.fields[k];if(el.type==='checkbox')el.checked=!!v;else if(v!==undefined)el.value=v;const h=()=>{state.fields[k]=el.type==='checkbox'?el.checked:el.value;save()};el.addEventListener('input',h);el.addEventListener('change',h)})}\nfunction progress(){const keys=[...new Set([...document.querySelectorAll('[data-save]')].map(e=>e.dataset.save))];let done=keys.filter(k=>{const v=state.fields[k];return v===true||(v!==undefined&&String(v).trim()!=='')}).length;if(state.behaviors.length)done++;const pct=Math.round(done/(keys.length+1)*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%'}\nfunction renderBehaviors(){document.querySelectorAll('.zone .item').forEach(x=>x.remove());state.behaviors.forEach((b,i)=>{const z=[...document.querySelectorAll('.zone')].find(x=>x.dataset.zone===b.zone);if(!z)return;const w=document.createElement('div');w.className='item';const inp=document.createElement('input');inp.type='text';inp.value=b.text;inp.oninput=()=>{state.behaviors[i].text=inp.value;save()};const del=document.createElement('button');del.type='button';del.className='btn alt';del.textContent='×';del.onclick=()=>{state.behaviors.splice(i,1);renderBehaviors();save()};w.append(inp,del);z.append(w)})}\ndocument.getElementById('addBehavior').onclick=()=>{const txt=document.getElementById('newBehavior').value.trim();if(!txt)return;state.behaviors.push({text:txt,zone:document.getElementById('newZone').value});document.getElementById('newBehavior').value='';renderBehaviors();save()};\n\nconst moments=[\n{title:\"The deadline is slipping\",text:\"You realize at 10:30 a.m. that a deliverable due at 3:00 p.m. will not be ready. Your teammate is waiting on it, your manager is in back-to-back meetings, and you think you might recover if nothing else goes wrong.\",choices:[\n{label:\"Keep working for another hour. If you are still behind at noon, send an update.\",trust:2,friction:5,type:\"caution\",title:\"You preserved focus, but reduced the team's adjustment time.\",text:\"Waiting briefly is not automatically wrong. The risk is that the team has less room to resequence if recovery fails.\"},\n{label:\"Send a short update now: the deadline is at risk, you are still working it, and you will confirm status at noon.\",trust:9,friction:-4,type:\"good\",title:\"You surfaced risk without declaring failure.\",text:\"The team gets early visibility while you keep ownership of the work. This costs attention now but protects planning options.\"},\n{label:\"Ask the teammate whether 4:00 p.m. would still work before involving anyone else.\",trust:4,friction:1,type:\"caution\",title:\"You tested flexibility, but kept the issue narrow.\",text:\"This may solve the immediate dependency, but it can miss other downstream impacts the teammate does not see.\"}]},\n{title:\"The handoff is incomplete\",text:\"A teammate sends a file you need, but two fields are missing. You can probably infer them from last month's version. They are in a meeting for the next 45 minutes.\",choices:[\n{label:\"Infer the missing fields, flag what you assumed, and keep moving.\",trust:4,friction:2,type:\"caution\",title:\"You protected momentum, but accepted some risk.\",text:\"Making assumptions visible is better than hiding them. The question is whether the risk is low enough to proceed.\"},\n{label:\"Pause the work until the teammate is available so you do not introduce an error.\",trust:6,friction:5,type:\"caution\",title:\"You protected accuracy, but increased delay.\",text:\"Sometimes waiting is the right call. It also moves the cost to schedule, so the dependency needs to be visible.\"},\n{label:\"Send a quick message naming the missing fields, state the assumption you could use, and ask them to confirm when available.\",trust:10,friction:-5,type:\"good\",title:\"You kept the work moving and made the assumption visible.\",text:\"This balances momentum with transparency and gives the teammate a clear correction point.\"}]},\n{title:\"A rumor starts moving\",text:\"Several people are discussing a possible reorganization. A trusted coworker says they heard it from someone 'close to leadership.' Your team asks what you think.\",choices:[\n{label:\"Say you have heard the same thing but cannot confirm it, and suggest waiting for an official update.\",trust:-2,friction:5,type:\"caution\",title:\"You added credibility to an unverified story.\",text:\"The disclaimer helps, but repeating that you heard it too can make the rumor feel more authoritative.\"},\n{label:\"Say you do not have confirmed information and steer the team back to what is known today.\",trust:9,friction:-5,type:\"good\",title:\"You protected information quality.\",text:\"You did not dismiss the concern, but you avoided turning uncertainty into more uncertainty.\"},\n{label:\"Message your manager privately to ask whether there is anything the team needs to prepare for.\",trust:6,friction:0,type:\"good\",title:\"You sought clarity through an appropriate channel.\",text:\"This can be a strong move when preparation may be needed, though it does not guarantee the manager has more information.\"}]},\n{title:\"The customer finds your error\",text:\"A customer flags an error in a team deliverable. You made the original mistake, but two teammates reviewed the file before it went out.\",choices:[\n{label:\"Own your part immediately, correct the issue, then discuss the review breakdown after the customer is stabilized.\",trust:11,friction:-3,type:\"good\",title:\"You separated immediate recovery from process learning.\",text:\"You did not absorb all responsibility. You handled the customer impact first, then left room to examine the system.\"},\n{label:\"Explain that the file passed through multiple reviewers so the team understands this was not yours alone.\",trust:-4,friction:8,type:\"bad\",title:\"The timing makes context sound like deflection.\",text:\"The review breakdown matters, but leading with shared blame can slow recovery and weaken accountability.\"},\n{label:\"Correct the issue quietly, then raise the review problem at the next team meeting.\",trust:4,friction:3,type:\"caution\",title:\"You fixed the customer problem but delayed the learning.\",text:\"The team may miss an immediate chance to prevent another version of the same error.\"}]},\n{title:\"Someone needs help, and you are full\",text:\"A teammate asks for 45 minutes of help today. Their deadline matters. You also have a deliverable due by end of day and about an hour of buffer left.\",choices:[\n{label:\"Give them the 45 minutes. Your buffer exists for situations like this.\",trust:6,friction:3,type:\"caution\",title:\"You used buffer for a real need.\",text:\"This may be a good choice if your own work is stable. It also leaves little room if another issue appears.\"},\n{label:\"Offer 20 minutes now to unblock them, then agree on what they can finish independently.\",trust:10,friction:-5,type:\"good\",title:\"You supported the teammate without taking over the problem.\",text:\"The smaller intervention protects both the team need and your existing commitment.\"},\n{label:\"Explain that you cannot help today and ask them to find someone else.\",trust:0,friction:5,type:\"caution\",title:\"The boundary is clear, but the handoff is incomplete.\",text:\"Capacity limits are real. A stronger response would help route the need instead of ending the conversation there.\"}]},\n{title:\"The meeting ends with ambiguity\",text:\"A meeting runs five minutes over. People are clearly ready to leave. You think the decision was to move forward with Option B, but ownership and timing were never stated.\",choices:[\n{label:\"Send a recap message after the meeting with your understanding of the decision and ask people to correct it if needed.\",trust:8,friction:-2,type:\"good\",title:\"You closed the loop without extending the meeting.\",text:\"This protects time while making your assumptions visible. The tradeoff is that corrections may arrive later.\"},\n{label:\"Use one more minute in the meeting to confirm the decision, owner, and due date.\",trust:10,friction:-6,type:\"good\",title:\"You spent a minute to protect coordination.\",text:\"A small time cost now can prevent larger rework later.\"},\n{label:\"Let it go. If ownership matters, the project lead will follow up.\",trust:-6,friction:12,type:\"bad\",title:\"Ambiguity became someone else's problem.\",text:\"This preserves your time in the moment but increases the chance of different assumptions and delayed action.\"}]}];\nlet gi=0,trust=50,friction=50,locked=false;\nconst clamp=n=>Math.max(0,Math.min(100,n));\nfunction updateGameMeters(){document.getElementById('trustScore').textContent=trust;document.getElementById('frictionScore').textContent=friction;document.getElementById('trustMeter').style.width=trust+'%';document.getElementById('frictionMeter').style.width=friction+'%'}\nfunction renderGamePills(){const p=document.getElementById('gamePills');p.innerHTML='';moments.forEach((_,i)=>{const s=document.createElement('span');s.className='tb-pill'+(i<gi?' done':i===gi?' current':'');p.appendChild(s)})}\nfunction renderGame(){const h=document.getElementById('gameScenarios'),r=document.getElementById('gameResult'),n=document.getElementById('nextGameMoment');h.innerHTML='';r.hidden=true;r.className='tb-consequence';n.hidden=true;renderGamePills();if(gi>=moments.length){h.innerHTML='<div class=\"tb-complete\"><h4>Trust Bank complete</h4><p>Your choices showed how small decisions can build trust, create friction, or do both at the same time.</p><div class=\"tb-summary\"><div>Final Trust<strong>'+trust+'</strong></div><div>Final Friction<strong>'+friction+'</strong></div></div></div>';document.getElementById('gameProgress').textContent='Complete';return}const m=moments[gi];const no=document.createElement('div');no.className='tb-no';no.textContent='Team Moment '+(gi+1);const q=document.createElement('h4');q.className='tb-title';q.textContent=m.title;const d=document.createElement('p');d.className='tb-text';d.textContent=m.text;h.append(no,q,d);m.choices.forEach((c,idx)=>{const b=document.createElement('button');b.type='button';b.className='gameChoice';b.textContent=c.label;b.onclick=()=>choose(idx);h.appendChild(b)});document.getElementById('gameProgress').textContent=`Moment ${gi+1} of ${moments.length}`;locked=false}\nfunction choose(idx){if(locked)return;locked=true;const c=moments[gi].choices[idx];trust=clamp(trust+c.trust);friction=clamp(friction+c.friction);updateGameMeters();document.querySelectorAll('#gameScenarios .gameChoice').forEach(b=>b.disabled=true);const r=document.getElementById('gameResult');r.hidden=false;r.className='tb-consequence '+c.type;r.innerHTML='<h4>'+c.title+'</h4><p>'+c.text+'</p><div class=\"tb-deltas\"><span class=\"tb-delta\">Trust '+(c.trust>0?'+':'')+c.trust+'</span><span class=\"tb-delta\">Friction '+(c.friction>0?'+':'')+c.friction+'</span></div>';document.getElementById('nextGameMoment').hidden=false}\ndocument.getElementById('nextGameMoment').onclick=()=>{gi++;renderGame()};\ndocument.getElementById('resetGame').onclick=()=>{gi=0;trust=50;friction=50;locked=false;updateGameMeters();renderGame()};\nfunction auction(){const total=[...document.querySelectorAll('.auctionInput')].reduce((s,e)=>s+Number(e.value||0),0),el=document.getElementById('auctionTotal');el.textContent=total+' / 10 points';el.classList.toggle('over',total>10)}\nfunction download(){const clone=document.documentElement.cloneNode(true);clone.querySelectorAll('[data-save]').forEach(el=>{const v=state.fields[el.dataset.save];if(el.tagName==='TEXTAREA')el.textContent=v||'';else if(el.tagName==='SELECT')[...el.options].forEach(o=>{if(o.value===v||o.text===v)o.setAttribute('selected','selected');else o.removeAttribute('selected')});else if(el.type==='checkbox'){if(v)el.setAttribute('checked','checked');else el.removeAttribute('checked')}else el.setAttribute('value',v||'')});const blob=new Blob(['<!DOCTYPE html>\\n'+clone.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Contributing_to_Team_Success_My_Work.html';document.body.appendChild(a);a.click();a.remove()}\ndocument.getElementById('downloadBtn').onclick=download;document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear all workbook entries?')){localStorage.removeItem(KEY);location.reload()}};\nconst links=[...document.querySelectorAll('.nav a')],targets=links.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.remove('active'));const a=links.find(x=>document.querySelector(x.getAttribute('href'))===e.target);if(a)a.classList.add('active')}}),{rootMargin:'-30% 0px -60% 0px'}).observe;\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const a=links.find(x=>document.querySelector(x.getAttribute('href'))===e.target);if(!a)return;links.forEach(x=>x.classList.remove('active','group-current'));a.classList.add('active');let g=a;while(g&&g.classList.contains('sub'))g=g.previousElementSibling;if(g&&g!==a)g.classList.add('group-current');const sb=document.querySelector('.side'),r=a.getBoundingClientRect(),sr=sb.getBoundingClientRect();if(getComputedStyle(sb).position==='sticky'&&(r.top<sr.top+80||r.bottom>sr.bottom-40))sb.scrollTop+=r.top-sr.top-sr.height/3}}),{rootMargin:'-30% 0px -60% 0px'});targets.forEach(t=>io.observe(t));\nbind();renderBehaviors();renderGame();auction();progress();\n</script>\n\n</body></html>"
  </script>
