document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ite;transform:translateX(2px)}\n.nav a.sub{padding:6px 10px 6px 30px;margin:1px 0;font-size:12.5px;font-weight:500;color:#b9d6e4;align-items:flex-start;line-height:1.3}\n.nav a.sub .hnum{flex:0 0 20px;font-size:11px;font-weight:800;color:#7bc2e7;letter-spacing:.3px;padding-top:1px}\n.nav a.sub.active .hnum{color:#ffb15e}\n@media(max-width:1050px){.nav a.sub{flex:1 1 100%!important;padding-left:30px}.nav a:not(.sub){flex:1 1 100%!important;margin-top:8px}}.nav a.group-current{color:white}.nav a.group-current .dot{background:var(--orange)}\n.dot{width:8px;height:8px;border-radius:50%;background:#8fc7e5;flex:0 0 auto}\n.progressBox{margin-top:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:13px}\n.progressLabel{display:flex;justify-content:space-between;font-size:12px;color:#cbe1eb;margin-bottom:8px}.bar{height:8px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ffb15e);transition:.3s}\n.sidebar small{display:block;margin-top:12px;color:#a8c8d7;line-height:1.45}\n.main{padding:34px clamp(22px,4vw,64px) 90px;max-width:1320px;width:100%;margin:0 auto}\n.hero{background:linear-gradient(120deg,#fff 0%,#fff 58%,#eaf6fb 100%);border:1px solid #dbeaf1;border-radius:28px;padding:40px 42px;box-shadow:var(--shadow);margin-bottom:30px;position:relative;overflow:hidden}\n.hero:after{content:\"\";position:absolute;right:-60px;top:-90px;width:310px;height:310px;border-radius:50%;border:38px solid rgba(47,143,196,.08);box-shadow:0 0 0 28px rgba(245,130,32,.05)}\n.kicker{display:inline-flex;align-items:center;gap:8px;color:var(--orange);font-weight:800;letter-spacing:1.4px;text-transform:uppercase;font-size:12px}.kicker:before{content:\"\";width:26px;height:6px;background:var(--orange);border-radius:4px}\n.hero h2{font-size:clamp(36px,5vw,58px);line-height:1.02;margin:12px 0 10px;color:var(--navy);max-width:760px}.hero p{font-size:19px;max-width:720px;line-height:1.5;color:#486572;margin:0}\n.heroMeta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.pill{border:1px solid #cfe1e9;background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--navy)}.pill.orange{background:var(--cream);border-color:#f8d7b0;color:#9b5215}\n.card{background:rgba(255,255,255,.97);border:1px solid #dceaf0;border-radius:24px;padding:30px;box-shadow:0 10px 28px rgba(15,65,86,.08);margin:26px 0}\n.sectionDivider{margin:48px 0 16px;padding:20px 24px;border-radius:20px;background:linear-gradient(110deg,var(--navy),var(--navy2));color:white;box-shadow:var(--shadow)}.sectionDivider h2{margin:4px 0;font-size:30px}.sectionDivider p{margin:4px 0 0;color:#dceef5}\n.sectionhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.sectionhead h3{font-size:28px;line-height:1.08;margin:4px 0;color:var(--navy)}.sectionhead p{margin:7px 0 0;color:#617884;line-height:1.5}\n.badge{white-space:nowrap;background:var(--orange);color:white;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;letter-spacing:.4px}\n.refGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.refBox{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fbfdfe}.refBox h4{margin:0 0 7px;color:var(--navy)}.refBox p{margin:0;color:#5b717b;font-size:14px;line-height:1.45}\n.info{padding:15px 17px;border-radius:16px;background:#f2f8fb;border:1px solid #d8e8ef;margin:14px 0;line-height:1.5}.info.orange{background:#fff8ef;border-color:#f2d7b9}\n.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.step{display:flex;gap:12px;padding:14px;border-radius:16px;background:#f7fbfd;border:1px solid #dbe9ef}.num{width:30px;height:30px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800;flex:0 0 auto}\ntextarea,input,select{font:inherit;color:var(--ink)}textarea{width:100%;min-height:95px;resize:vertical;border:1px solid #bad1dc;border-radius:14px;padding:12px 13px;background:#fbfdfe;outline:none}input[type=\"text\"],input[type=\"number\"],input[type=\"time\"],input:not([type]){width:100%;border:1px solid #bad1dc;border-radius:11px;padding:10px 11px;background:#fbfdfe;outline:none}select{width:100%;border:1px solid #bad1dc;border-radius:11px;padding:9px 10px;background:white;outline:none}textarea:focus,input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,143,196,.13)}\nlabel{font-weight:700;color:var(--navy)}.muted{font-size:12px;color:var(--muted);margin-top:3px}\n.choiceRow{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.choice{display:flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid #d9e7ed;border-radius:12px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}.choice input{accent-color:var(--blue)}\n.threeCols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.twoCols{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n.fieldCard{padding:16px;border-radius:17px;background:#fbfdfe;border:1px solid #dbe9ef}.fieldCard h4{margin:0 0 8px;color:var(--navy)}.fieldCard label{display:block;margin:10px 0 6px}\n.tableWrap{overflow:auto;border:1px solid #dbe8ee;border-radius:16px}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px 11px;border-bottom:1px solid #e2edf2;vertical-align:top;text-align:left}thead th{background:#eaf5fa;color:var(--navy);font-size:13px}tbody th{white-space:nowrap;background:#f8fbfc;color:var(--navy);font-size:13px}.fixedCell{background:#fff3e7;color:#8e4e18;font-weight:800}\n.smallText{min-height:58px}.rankInput{max-width:70px}.totalBadge{display:inline-flex;gap:8px;align-items:center;padding:9px 12px;border-radius:999px;background:#edf7fc;border:1px solid #cbe2ee;font-weight:800;color:var(--navy)}\n.taskBank{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px;background:#f3f8fb;border:1px dashed #a9c8d7;border-radius:18px;margin-bottom:18px;min-height:132px;align-content:start}.task{background:white;border:1px solid #c6dbe5;border-radius:13px;padding:12px;cursor:grab;box-shadow:0 4px 10px rgba(10,61,82,.06);font-size:14px;line-height:1.3;user-select:none;display:flex;flex-direction:column;gap:10px}.taskLabel{font-weight:700;color:var(--navy)}.task.selected{outline:3px solid rgba(245,130,32,.28);border-color:var(--orange)}.task:focus-visible{outline:3px solid rgba(47,143,196,.28)}.sortControls label{font-size:12px;color:#58707b}.sortRow{display:flex;gap:8px;align-items:center}.moveBtn{padding:8px 11px;border-radius:10px;background:var(--navy2);color:white;font-weight:800;border:0;cursor:pointer}\n.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.zone{min-height:160px;border:2px dashed #b8d2df;border-radius:18px;padding:10px;background:#fbfdfe}.zone h4{margin:0 0 8px;padding:9px 8px;border-radius:10px;background:#eaf5fa;color:var(--navy);font-size:14px;text-align:center}.zone.today{border-color:#efad6c;background:#fffaf4}.zone.remove{background:#f8fafb}.zone .task{margin-bottom:8px}.zoneHint{font-size:11px;color:#8aa0ab;text-align:center;margin:5px}\n.partner{margin-top:18px;padding:17px;border-radius:18px;background:linear-gradient(135deg,#eef8fc,#fff);border-left:5px solid var(--orange)}.partner label{display:block;margin-bottom:7px}\n.scenarioGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scenarioCard{position:relative;padding:18px;border:1px solid #dbe8ee;border-radius:18px;background:#fbfdfe}.scenarioCard h4{margin:0 0 12px 38px;color:var(--navy)}.scenarioLetter{position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:white;font-weight:900}.scenarioCard label{display:block;margin:10px 0 6px;font-size:13px}\n.lineField{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;margin:8px 0}.lineField label{font-size:13px}\n.actionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.actionCard{padding:18px;border-radius:18px;border:1px solid #dbe8ee;background:white}.actionCard h4{margin:0 0 8px;color:var(--navy)}\n.toolbar{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:9px;margin-top:34px;padding:14px 0;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.96) 32%);z-index:10}button{border:0;border-radius:13px;padding:11px 15px;font-weight:800;cursor:pointer;font:inherit;box-shadow:0 5px 15px rgba(6,55,76,.12)}.btnPrimary{background:var(--navy);color:white}.btnAlt{background:white;color:var(--navy);border:1px solid #bfd6e0}.status{align-self:center;margin-right:auto;background:rgba(255,255,255,.94);border:1px solid #dbe8ee;border-radius:999px;padding:9px 12px;font-size:12px;color:#607782}\n.footer{text-align:center;color:#71858e;font-size:12px;margin-top:28px}.footer img{width:95px;opacity:.9;display:block;margin:0 auto 8px}\n.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}\n@media(max-width:1050px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.nav{display:flex;flex-wrap:wrap}.nav a{flex:1 1 200px}.threeCols,.refGrid,.actionGrid{grid-template-columns:1fr}.twoCols,.scenarioGrid{grid-template-columns:1fr}.zones{grid-template-columns:repeat(2,1fr)}.taskBank{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:650px){.main{padding:20px 14px 70px}.hero,.card{padding:22px 18px;border-radius:19px}.sectionhead{display:block}.badge{display:inline-block;margin-top:10px}.zones,.taskBank{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.status{width:100%;text-align:center;margin:0}.sortRow,.lineField{grid-template-columns:1fr;display:grid}}\n@media print{body{background:white}.shell{display:block}.sidebar,.toolbar{display: >10</span>Difficult Situation Practice</a>\n    <a href=\"#capstone\"><span class=\"dot\"></span>Capstone</a>\n    <a class=\"sub\" href=\"#act11\"><span class=\"hnum\">11</span>Capstone Activity Packet</a>\n    <a href=\"#actionplan\"><span class=\"dot\"></span>Action Plan</a>\n    <a class=\"sub\" href=\"#act12\"><span class=\"hnum\">12</span>Personal Action Plan</a>\n    <a class=\"sub\" href=\"#act13\"><span class=\"hnum\">13</span>Commit to the First Step</a>\n  </nav>\n  <div class=\"progressBox\"><div class=\"progressLabel\"><span>Workbook progress</span><strong id=\"progressText\">0%</strong></div><div class=\"bar\"><span id=\"progressBar\"></span></div></div>\n  <small>Your entries save in this browser while you work. Use Download My Work before closing the workbook.</small>\n</aside>\n\n<main class=\"main\">\n<section id=\"welcome\" class=\"hero\">\n  <div class=\"kicker\">One-day participant workbook</div>\n  <h2>Focus. Prioritize. Deliver.</h2>\n  <p>Use this workbook to capture decisions, complete activities, and leave with a practical action plan. The course is built around one idea: time is fixed and choices are flexible.</p>\n  <div class=\"heroMeta\"><span class=\"pill\">Six sections</span><span class=\"pill\">Integrated capstone</span><span class=\"pill orange\">Autosaves in your browser</span></div>\n</section>\n\n<section class=\"card\" id=\"challenge\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Opening reflection</div><h3>Start with Your Challenge</h3><p>Capture one time-management challenge you would like to handle better. You will return to it in your action plan.</p></div><span class=\"badge\">ABOUT 1 MINUTE</span></div>\n  <label for=\"startChallenge\">What would make today worth your time?</label>\n  <textarea id=\"startChallenge\" data-save=\"startChallenge\" placeholder=\"Too many tasks, interruptions, competing requests, unclear priorities, difficulty saying no...\"></textarea>\n</section>\n\n<div id=\"section1\" class=\"sectionDivider\"><div class=\"kicker\">Section 1</div><h2>Take Control of Multiple Tasks</h2><p>Identify where time goes, then decide where work belongs.</p></div>\n\n<section class=\"card\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Quick reference</div><h3>Control, Influence, Adapt</h3><p>Use these three classifications during Your Top Time Drains.</p></div></div>\n  <div class=\"refGrid\">\n    <div class=\"refBox\"><h4>Control</h4><p>You can change it yourself.</p></div>\n    <div class=\"refBox\"><h4>Influence</h4><p>Changing it needs someone else's agreement.</p></div>\n    <div class=\"refBox\"><h4>Adapt</h4><p>It is a real constraint you need to plan around.</p></div>\n  </div>\n</section>\n\n<section id=\"timeDrains\" class=\"card\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Activity</div><h3>Your Top Time Drains</h3><p>Identify three drains, classify each one, and note why.</p></div><span class=\"badge\">10 MINUTES \u00b7 PAIRS</span></div>\n  <div class=\"threeCols\">\n    <div class=\"fieldCard\"><h4>Time drain 1</h4><textarea data-save=\"drain1\" placeholder=\"Describe the time drain...\"></textarea><div class=\"choiceRow\"><label class=\"choice\"><input type=\"radio\" name=\"class1\" value=\"Control\" data-save=\"class1\"> Control</label><label class=\"choice\"><input type=\"radio\" name=\"class1\" value=\"Influence\" data-save=\"class1\"> Influence</label><label class=\"choice\"><input type=\"radio\" name=\"class1\" value=\"Adapt\" data-save=\"class1\"> Adapt</label></div><label>Why did you classify it this way?</label><textarea class=\"smallText\" data-save=\"drain_reason_1\" placeholder=\"Reasoning...\"></textarea></div><div class=\"fieldCard\"><h4>Time drain 2</h4><textarea data-save=\"drain2\" placeholder=\"Describe the time drain...\"></textarea><div class=\"choiceRow\"><label class=\"choice\"><input type=\"radio\" name=\"class2\" value=\"Control\" data-save=\"class2\"> Control</label><label class=\"choice\"><input ty , shrink, or go.</p></div><span class=\"badge\">15 MINUTES \u00b7 GROUPS OF 3\u20135</span></div>\n  <div class=\"info\"><span class=\"totalBadge\">Selected work: <span id=\"crowdTotal\">0</span> of 240 minutes</span></div>\n  <div class=\"tableWrap\"><table><thead><tr><th>Task</th><th>Rank</th><th>Decision</th><th>Rationale</th></tr></thead><tbody>\n      <tr>\n        <td><strong>Track-fault report for safety review</strong><div class=\"muted\">45 minutes</div></td>\n        <td><input class=\"rankInput\" type=\"number\" min=\"1\" max=\"8\" data-save=\"crowd_rank_1\" aria-label=\"Rank for Track-fault report for safety review\"></td>\n        <td>\n          <select class=\"crowdDecision\" data-minutes=\"45\" data-save=\"crowd_decision_1\" aria-label=\"Decision for Track-fault report for safety review\">\n            <option value=\"\">Select...</option>\n            <option value=\"fits\">Fits in 4 hours</option>\n            <option value=\"move\">Move</option>\n            <option value=\"shrink\">Shrink</option>\n            <option value=\"go\">Go</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"crowd_reason_1\" aria-label=\"Rationale for Track-fault report for safety review\" placeholder=\"Why?\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Customer complaint: platform signage</strong><div class=\"muted\">30 minutes</div></td>\n        <td><input class=\"rankInput\" type=\"number\" min=\"1\" max=\"8\" data-save=\"crowd_rank_2\" aria-label=\"Rank for Customer complaint: platform signage\"></td>\n        <td>\n          <select class=\"crowdDecision\" data-minutes=\"30\" data-save=\"crowd_decision_2\" aria-label=\"Decision for Customer complaint: platform signage\">\n            <option value=\"\">Select...</option>\n            <option value=\"fits\">Fits in 4 hours</option>\n            <option value=\"move\">Move</option>\n            <option value=\"shrink\">Shrink</option>\n            <option value=\"go\">Go</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"crowd_reason_2\" aria-label=\"Rationale for Customer complaint: platform signage\" placeholder=\"Why?\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Weekly leadership report</strong><div class=\"muted\">60 minutes</div></td>\n        <td><input class=\"rankInput\" type=\"number\" min=\"1\" max=\"8\" data-save=\"crowd_rank_3\" aria-label=\"Rank for Weekly leadership report\"></td>\n        <td>\n          <select class=\"crowdDecision\" data-minutes=\"60\" data-save=\"crowd_decision_3\" aria-label=\"Decision for Weekly leadership report\">\n            <option value=\"\">Select...</option>\n            <option value=\"fits\">Fits in 4 hours</option>\n            <option value=\"move\">Move</option>\n            <option value=\"shrink\">Shrink</option>\n            <option value=\"go\">Go</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"crowd_reason_3\" aria-label=\"Rationale for Weekly leadership report\" placeholder=\"Why?\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Project milestone due Friday</strong><div class=\"muted\">90 minutes</div></td>\n        <td><input class=\"rankInput\" type=\"number\" min=\"1\" max=\"8\" data-save=\"crowd_rank_4\" aria-label=\"Rank for Project milestone due Friday\"></td>\n        <td>\n          <select class=\"crowdDecision\" data-minutes=\"90\" data-save=\"crowd_decision_4\" aria-label=\"Decision for Project milestone due Friday\">\n            <option value=\"\">Select...</option>\n            <option value=\"fits\">Fits in 4 hours</option>\n            <option value=\"move\">Move</option>\n            <option value=\"shrink\">Shrink</option>\n            <option value=\"go\">Go</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"crowd_reason_4\" aria-label=\"Rationale for Project milestone due Friday\" placeholder=\"Why?\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Manager asks for talking points</strong><div class=\"muted\">30 minutes</div></td>\n        <td><input class=\"rankInput\" type=\"number\" min=\"1\" max=\"8\" data-save=\"crowd_rank_5\" aria-label=\"Rank for Manager asks for talking points\"></td>\n        <td>\n          <select class=\"crowdDecision\" data-minutes=\"30\" data-save=\"crowd_decision_5\" aria-label=\"Decision for Manager asks for talking points\">\n            <option value=\"\">Select...</option>\n            <option value=\"fits\">Fits in 4 hours</option>\n            <option value=\"move\">Move</option>\n            <option value=\"shrink\">Shrink</option>\n            <option value=\"go\">Go</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"crowd_reason_5\" aria-label=\"Rationale for Manager asks for talking points\" placeholder=\"Why?\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Expense reconciliation</strong><div class=\"muted\">45 minutes</div></td>\n        <td><input class=\"rankInput\" type=\"number\" min=\"1\" max=\"8\" data-save=\"crowd_rank_6\" aria-label=\"Rank for Expense reconciliation\"></td>\n        <td>\n          <select class=\"crowdDecision\" data-minutes=\"45\" data-save=\"crowd_decision_6\" aria-label=\"Decision for Expense reconciliation\">\n            <option value=\"\">Select...</option>\n            <option value=\"fits\">Fits in 4 hours</option>\n            <option value=\"move\">Move</option>\n            <option value=\"shrink\">Shrink</option>\n            <option value=\"go\">Go</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"crowd_reason_6\" aria-label=\"Rationale for Expense reconciliation\" placeholder=\"Why?\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Optional vendor demo meeting</strong><div class=\"muted\">60 minutes</div></td>\n        <td><input class=\"rankInput\" type=\"number\" min=\"1\" max=\"8\" data-save=\"crowd_rank_7\" aria-label=\"Rank for Optional vendor demo meeting\"></td>\n        <td>\n          <select class=\"crowdDecision\" data-minutes=\"60\" data-save=\"crowd_decision_7\" aria-label=\"Decision for Optional vendor demo meeting\">\n            <option value=\"\">Select...</option>\n            <option value=\"fits\">Fits in 4 hours</option>\n            <option value=\"move\">Move</option>\n            <option value=\"shrink\">Shrink</option>\n            <option value=\"go\">Go</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"crowd_reason_7\" aria-label=\"Rationale for Optional vendor demo meeting\" placeholder=\"Why?\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Draft process improvement idea</strong><div class=\"muted\">60 minutes</div></td>\n        <td><input class=\"rankInput\" type=\"number\" min=\"1\" max=\"8\" data-save=\"crowd_rank_8\" aria-label=\"Rank for Draft process improvement idea\"></td>\n        <td>\n          <select class=\"crowdDecision\" data-minutes=\"60\" data-save=\"crowd_decision_8\" aria-label=\"Decision for Draft process improvement idea\">\n            <option value=\"\">Select...</option>\n            <option value=\"fits\">Fits in 4 hours</option>\n            <option value=\"move\">Move</option>\n            <option value=\"shrink\">Shrink</option>\n            <option value=\"go\">Go</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"crowd_reason_8\" aria-label=\"Rationale for Draft process improvement idea\" placeholder=\"Why?\"></textarea></td>\n      </tr>\n    </tbody></table></div>\n  <div class=\"partner\"><label>Group tradeoffs</label><textarea data-save=\"crowd_tradeoffs\" placeholder=\"What did you move or drop? Which choice generated the most disagreement?\"></textarea></div>\n</section>\n\n<div id=\"section4\" class=\"sectionDivider\"><div class=\"kicker\">Section 4</div><h2>Urgent Compared with Important</h2><p>Match the kind of work to the right response.</p></div>\n\n<section class=\"card\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Reference</div><h3>Urgent and Important Matrix</h3><p>Context determines the quadrant. \u201cNot important\u201d does not mean useless.</p></div></div>\n  <div class=\"refGrid\">\n    <div class=\"refBox\"><h4>Act</h4><p>Urgent and important.</p></div>\n    <div class=\"refBox\"><h4>Schedule</h4><p>Important, not urgent.</p></div>\n    <div class=\"refBox\"><h4>Coordinate or delegate</h4><p>Urgent, but not important for you personally.</p></div>\n  </div>\n  <div class=\"refBox\"><h4>Reduce or remove</h4><p>Neither urgent nor important. Reduce, streamline, or remove where appropriate.</p></div>\n</section>\n\n<section class=\"card\" id=\"act06\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Activity</div><h3>Matrix Practice</h3><p>Place each task in the matrix, then identify the next action. Missing context is part of the exercise.</p></div><span class=\"badge\">12 MINUTES \u00b7 PAIRS OR GROUPS</span></div>\n  <div class=\"tableWrap\"><table><thead><tr><th>Task</th><th>Classification</th><th>Next action</th></tr></thead><tbody>\n      <tr>\n        <td><strong>Unresolved equipment issue</strong></td>\n        <td>\n          <select data-save=\"matrix_class_1\" aria-label=\"Matrix classification for Unresolved equipment issue\">\n            <option value=\"\">Select...</option>\n            <option>Act</option>\n            <option>Schedule</option>\n            <option>Coordinate or delegate</option>\n            <option>Reduce or remove</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"matrix_next_1\" aria-label=\"Next action for Unresolved equipment issue\" placeholder=\"Next action...\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Certification deadline next month</strong></td>\n        <td>\n          <select data-save=\"matrix_class_2\" aria-label=\"Matrix classification for Certification deadline next month\">\n            <option value=\"\">Select...</option>\n            <option>Act</option>\n            <option>Schedule</option>\n            <option>Coordinate or delegate</option>\n            <option>Reduce or remove</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"matrix_next_2\" aria-label=\"Next action for Certification deadline next month\" placeholder=\"Next action...\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Recurring report due next week</strong></td>\n        <td>\n          <select data-save=\"matrix_class_3\" aria-label=\"Matrix classification for Recurring report due next week\">\n            <option value=\"\">Select...</option>\n            <option>Act</option>\n            <option>Schedule</option>\n            <option>Coordinate or delegate</option>\n            <option>Reduce or remove</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"matrix_next_3\" aria-label=\"Next action for Recurring report due next week\" placeholder=\"Next action...\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Optional meeting invitation</strong></td>\n        <td>\n          <select data-save=\"matrix_class_4\" aria-label=\"Matrix classification for Optional meeting invitation\">\n            <option value=\"\">Select...</option>\n            <option>Act</option>\n            <option>Schedule</option>\n            <option>Coordinate or delegate</option>\n            <option>Reduce or remove</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"matrix_next_4\" aria-label=\"Next action for Optional meeting invitation\" placeholder=\"Next action...\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Colleague request, unclear deadline</strong></td>\n        <td>\n          <select data-save=\"matrix_class_5\" aria-label=\"Matrix classification for Colleague request, unclear deadline\">\n            <option value=\"\">Select...</option>\n            <option>Act</option>\n            <option>Schedule</option>\n            <option>Coordinate or delegate</option>\n            <option>Reduce or remove</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"matrix_next_5\" aria-label=\"Next action for Colleague request, unclear deadline\" placeholder=\"Next action...\"></textarea></td>\n      </tr>\n    \n      <tr>\n        <td><strong>Process improvement idea</strong></td>\n        <td>\n          <select data-save=\"matrix_class_6\" aria-label=\"Matrix classification for Process improvement idea\">\n            <option value=\"\">Select...</option>\n            <option>Act</option>\n            <option>Schedule</option>\n            <option>Coordinate or delegate</option>\n            <option>Reduce or remove</option>\n          </select>\n        </td>\n        <td><textarea class=\"smallText\" data-save=\"matrix_next_6\" aria-label=\"Next action for Process improvement idea\" placeholder=\"Next action...\"></textarea></td>\n      </tr>\n    </tbody></table></div>\n  <div class=\"partner\"><label>What information did you wish you had?</label><textarea data-save=\"matrix_missing\" placeholder=\"Deadline? Who else is affected? Can someone else do it? What happens if it waits?\"></textarea></div>\n</section>\n\n<div id=\"section5\" class=\"sectionDivider\"><div class=\"kicker\">Section 5</div><h2>Cope with Pressure and Stress</h2><p>Recognize overload early and reset the plan when the day changes.</p></div>\n\n<section class=\"card\" id=\"act07\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Reflection</div><h3>Recognize Overload Early</h3><p>Select the signal that tends to show up first for you, then pair it with one response.</p></div><span class=\"badge\">ABOUT 1 MINUTE</span></div>\n  <div class=\"choiceRow\"><label class=\"choice\"><input type=\"radio\" name=\"overloadSignal\" value=\"Too many open commitments\" data-save=\"overloadSignal\"> Too many open commitments</label><label class=\"choice\"><input type=\"radio\" name=\"overloadSignal\" value=\"Constant switching\" data-save=\"overloadSignal\"> Constant switching</label><label class=\"choice\"><input type=\"radio\" name=\"overloadSignal\" value=\"Missed details\" data-save=\"overloadSignal\"> Missed details</label><label class=\"choice\"><input type=\"radio\" name=\"overloadSignal\" value=\"Rushing\" data-save=\"overloadSignal\"> Rushing</label><label class=\"choice\"><input type=\"radio\" name=\"overloadSignal\" value=\"Difficulty deciding what comes next\" data-save=\"overloadSignal\"> Difficulty deciding what comes next</label><label class=\"choice\"><input type=\"radio\" name=\"overloadSignal\" value=\"Working longer without meaningful progress\" data-save=\"overloadSignal\"> Working longer without meaningful progress</label></div>\n  <div class=\"partner\"><label>When I notice this signal, I will...</label><textarea data-save=\"overloadResponse\" placeholder=\"Capture commitments, clarify next actions, reassess priorities, protect focus, renegotiate work...\"></textarea></div>\n</section>\n\n<section class=\"card\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Reference</div><h3>Pressure Reset</h3><p>Use this five-step process when the original plan no longer fits.</p></div></div>\n  <div class=\"steps\">\n    <div class=\"step\"><div class=\"num\">1</div><div><strong>Stop</strong><br>Pause long enough to see what changed.</div></div>\n    <div class=\"step\"><div class=\"num\">2</div><div><strong>Reassess</strong><br>Establish what is true now.</div></div>\n    <div class=\"step\"><div class=\"num\">3</div><div><strong>Reprioritize</strong><br>Decide what deserves space now.</div></div>\n    <div class=\"step\"><div class=\"num\">4</div><div><strong>Communicate</strong><br>Tell affected people what changed.</div></div>\n    <div class=\"step\"><div class=\"num\">5</div><div><strong>Restart</strong><br>Choose one clear next action.</div></div>\n  </div>\n</section>\n\n<section class=\"card\" id=\"act08\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Activity</div><h3>Pressure Reset: Your Day Changes at 1:30 p.m.</h3><p>Rebuild an afternoon after three competing changes arrive at once.</p></div><span class=\"badge\">12 MINUTES \u00b7 GROUPS OF 3\u20135</span></div>\n  <div class=\"refGrid\">\n    <div class=\"refBox\"><h4>Original afternoon</h4><p>Team meeting at 1:00. Finish the inspection report at 2:00. Email and follow-ups at 3:30.</p></div>\n    <div class=\"refBox\"><h4>Change 1</h4><p>A high-priority data request arrives, due at 4:00.</p></div>\n    <div class=\"refBox\"><h4>Changes 2 and 3</h4><p>The meeting is running long. A teammate needs your figures by 2:30 for their own deadline.</p></div>\n  </div>\n  <div class=\"twoCols\">\n    <div class=\"fieldCard\"><h4>What will you protect?</h4><textarea data-save=\"pressure_protect\"></textarea></div>\n    <div class=\"fieldCard\"><h4>What moves or stops?</h4><textarea data-save=\"pressure_move\"></textarea></div>\n    <div class=\"fieldCard\"><h4>Who needs communication?</h4><textarea data-save=\"pressure_communicate\"></textarea></div>\n    <div class=\"fieldCard\"><h4>What is your first action when you restart?</h4><textarea data-save=\"pressure_restart\"></textarea></div>\n  </div>\n  <div class=\"partner\"><label>Which decision felt hardest, and why?</label><textarea data-save=\"pressure_hardest\"></textarea></div>\n</section>\n\n<div id=\"section6\" class=\"sectionDivider\"><div class=\"kicker\">Section 6</div><h2>Manage Difficult Situations</h2><p>Make workload conflicts discussable before they become missed deadlines or overload.</p></div>\n\n<section class=\"card\" id=\"act09\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Practice</div><h3>Say \u201cNo\u201d Without Creating a Dead End</h3><p>Write a professional response that makes the constraint visible and still offers a path forward.</p></div><span class=\"badge\">7 MINUTES</span></div>\n  <div class=\"steps\">\n    <div class=\"step\"><div class=\"num\">1</div><div><strong>Acknowledge the request</strong><br>\u201cI understand this matters for the briefing.\u201d</div></div>\n    <div class=\"step\"><div class=\"num\">2</div><div><strong>Explain the constraint</strong><br>\u201cI\u2019m committed to the safety report until 2:00.\u201d</div></div>\n    <div class=\"step\"><div class=\"num\">3</div><div><strong>Offer an alternative</strong><br>\u201cI can start at 2:00, or Jordan may be free now.\u201d</div></div>\n    <div class=\"step\"><div class=\"num\">4</div><div><strong>Confirm the next step</strong><br>\u201cSo I\u2019ll send it by 3:30. Does that work?\u201d</div></div>\n  </div>\n  <label for=\"sayNoOwn\">Rewrite the response in language you would naturally use at work.</label>\n  <textarea id=\"sayNoOwn\" data-save=\"sayNoOwn\" placeholder=\"Write your version here...\"></textarea>\n</section>\n\n<section class=\"card\" id=\"act10\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Activity</div><h3>Difficult Situation Practice</h3><p>Your group receives one scenario. Name the issue, decide what conversation needs to happen, and write the exact opening line.</p></div><span class=\"badge\">14 MINUTES \u00b7 ONE SCENARIO PER GROUP</span></div>\n  <div class=\"scenarioGrid\">\n  <div class=\"scenarioCard\">\n    <div class=\"scenarioLetter\">A</div>\n    <h4>Shifting deadline: the date just moved up</h4>\n    <label>Real time-management issue<textarea data-save=\"scenario_A_issue\" placeholder=\"Name the issue...\"></textarea></label>\n    <label>Conversation that needs to happen<textarea data-save=\"scenario_A_conversation\" placeholder=\"Who needs to talk, and about what?\"></textarea></label>\n    <label>Exact opening line<textarea data-save=\"scenario_A_opening\" placeholder=\"Write the exact first sentence you would say...\"></textarea></label>\n  </div>\n\n  <div class=\"scenarioCard\">\n    <div class=\"scenarioLetter\">B</div>\n    <h4>Unclear assignment: no owner, no definition of done</h4>\n    <label>Real time-management issue<textarea data-save=\"scenario_B_issue\" placeholder=\"Name the issue...\"></textarea></label>\n    <label>Conversation that needs to happen<textarea data-save=\"scenario_B_conversation\" placeholder=\"Who needs to talk, and about what?\"></textarea></label>\n    <label>Exact opening line<textarea data-save=\"scenario_B_opening\" placeholder=\"Write the exact first sentence you would say...\"></textarea></label>\n  </div>\n\n  <div class=\"scenarioCard\">\n    <div class=\"scenarioLetter\">C</div>\n    <h4>Overloaded employee who keeps saying yes</h4>\n    <label>Real time-management issue<textarea data-save=\"scenario_C_issue\" placeholder=\"Name the issue...\"></textarea></label>\n    <label>Conversation that needs to happen<textarea data-save=\"scenario_C_conversation\" placeholder=\"Who needs to talk, and about what?\"></textarea></label>\n    <label>Exact opening line<textarea data-save=\"scenario_C_opening\" placeholder=\"Write the exact first sentence you would say...\"></textarea></label>\n  </div>\n\n  <div class=\"scenarioCard\">\n    <div class=\"scenarioLetter\">D</div>\n    <h4>Repeated interruption from the same colleague</h4>\n    <label>Real time-management issue<textarea data-save=\"scenario_D_issue\" placeholder=\"Name the issue...\"></textarea></label>\n    <label>Conversation that needs to happen<textarea data-save=\"scenario_D_conversation\" placeholder=\"Who needs to talk, and about what?\"></textarea></label>\n    <label>Exact opening line<textarea data-save=\"scenario_D_opening\" placeholder=\"Write the exact first sentence you would say...\"></textarea></label>\n  </div>\n</div>\n</section>\n\n<div id=\"capstone\" class=\"sectionDivider\"><div class=\"kicker\">Capstone</div><h2>The Day Changed Again</h2><p>Sort the work, build the day, then communicate the tradeoff.</p></div>\n\n<section class=\"card\" id=\"act11\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Scenario</div><h3>Read the Day Before You Schedule It</h3><p>The workday begins at 8:00 a.m. and ends at 4:30 p.m. Everything will not fit.</p></div><span class=\"badge\">3 MINUTES</span></div>\n  <div class=\"info\"><strong>Starting conditions:</strong> Two fixed meetings, a monthly performance summary due at 3:00 p.m., and six competing work items with different levels of value and urgency.</div>\n  <div class=\"info orange\"><strong>At 10:15 a.m., the day changes:</strong> A customer-impacting service problem creates a new 45-minute data-summary request due at 12:30 p.m. A colleague requests a 60-minute analysis by 2:00 p.m. The 11:00 a.m. project coordination meeting extends to 12:15 p.m. You still need a short lunch and some buffer.</div>\n  <div class=\"fieldCard\"><h4>Record the second fixed meeting</h4><input data-save=\"cap_fixed2\" placeholder=\"Fixed meeting from the course activity...\"></div>\n  <div class=\"fieldCard\" style=\"margin-top:12px\"><h4>Six competing work items</h4><p class=\"muted\">Record the six items as they are introduced in your course materials.</p><div class=\"lineField\"><label for=\"cap_item_1\">Competing work item 1</label><input id=\"cap_item_1\" data-save=\"cap_item_1\" placeholder=\"Record the work item...\"></div><div class=\"lineField\"><label for=\"cap_item_2\">Competing work item 2</label><input id=\"cap_item_2\" data-save=\"cap_item_2\" placeholder=\"Record the work item...\"></div><div class=\"lineField\"><label for=\"cap_item_3\">Competing work item 3</label><input id=\"cap_item_3\" data-save=\"cap_item_3\" placeholder=\"Record the work item...\"></div><div class=\"lineField\"><label for=\"cap_item_4\">Competing work item 4</label><input id=\"cap_item_4\" data-save=\"cap_item_4\" placeholder=\"Record the work item...\"></div><div class=\"lineField\"><label for=\"cap_item_5\">Competing work item 5</label><input id=\"cap_item_5\" data-save=\"cap_item_5\" placeholder=\"Record the work item...\"></div><div class=\"lineField\"><label for=\"cap_item_6\">Competing work item 6</label><input id=\"cap_item_6\" data-save=\"cap_item_6\" placeholder=\"Record the work item...\"></div></div>\n</section>\n\n<section class=\"card\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Capstone \u00b7 Step 1</div><h3>Sort the Work</h3><p>Classify before scheduling. Your reasoning matters more than identical classifications.</p></div><span class=\"badge\">8 MINUTES \u00b7 TEAMS</span></div>\n  <div class=\"twoCols\">\n    <div class=\"fieldCard\"><h4>What must happen today?</h4><textarea data-save=\"cap_sort_today\"></textarea></div>\n    <div class=\"fieldCard\"><h4>What can be scheduled?</h4><textarea data-save=\"cap_sort_schedule\"></textarea></div>\n    <div class=\"fieldCard\"><h4>What needs clarification?</h4><textarea data-save=\"cap_sort_clarify\"></textarea></div>\n    <div class=\"fieldCard\"><h4>What can be delegated, coordinated, or removed?</h4><textarea data-save=\"cap_sort_other\"></textarea></div>\n  </div>\n  <div class=\"partner\"><label>What item generated the most disagreement?</label><textarea data-save=\"cap_sort_disagreement\"></textarea></div>\n</section>\n\n<section class=\"card\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Capstone \u00b7 Step 2</div><h3>Build the Day</h3><p>Fixed commitments first, then protected priority work, then buffer, then whatever routine work fits.</p></div><span class=\"badge\">8 MINUTES \u00b7 SAME TEAMS</span></div>\n  <div class=\"info\"><strong>Build from 8:00 a.m. to 4:30 p.m.</strong> Leave buffer and make tradeoffs visible.</div>\n  <div class=\"tableWrap\"><table><thead><tr><th>Time</th><th>Team schedule</th></tr></thead><tbody><tr><th scope=\"row\">8:00 a.m.</th><td><input data-save=\"cap_sched_0800\" aria-label=\"Capstone schedule at 8:00 a.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">8:30 a.m.</th><td><input data-save=\"cap_sched_0830\" aria-label=\"Capstone schedule at 8:30 a.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">9:00 a.m.</th><td><input data-save=\"cap_sched_0900\" aria-label=\"Capstone schedule at 9:00 a.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">9:30 a.m.</th><td><input data-save=\"cap_sched_0930\" aria-label=\"Capstone schedule at 9:30 a.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">10:00 a.m.</th><td><input data-save=\"cap_sched_1000\" aria-label=\"Capstone schedule at 10:00 a.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">10:30 a.m.</th><td><input data-save=\"cap_sched_1030\" aria-label=\"Capstone schedule at 10:30 a.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">11:00 a.m.</th><td><input data-save=\"cap_sched_1100\" aria-label=\"Capstone schedule at 11:00 a.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">11:30 a.m.</th><td><input data-save=\"cap_sched_1130\" aria-label=\"Capstone schedule at 11:30 a.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">12:00 p.m.</th><td><input data-save=\"cap_sched_1200\" aria-label=\"Capstone schedule at 12:00 p.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">12:30 p.m.</th><td><input data-save=\"cap_sched_1230\" aria-label=\"Capstone schedule at 12:30 p.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">1:00 p.m.</th><td><input data-save=\"cap_sched_1300\" aria-label=\"Capstone schedule at 1:00 p.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">1:30 p.m.</th><td><input data-save=\"cap_sched_1330\" aria-label=\"Capstone schedule at 1:30 p.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">2:00 p.m.</th><td><input data-save=\"cap_sched_1400\" aria-label=\"Capstone schedule at 2:00 p.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">2:30 p.m.</th><td><input data-save=\"cap_sched_1430\" aria-label=\"Capstone schedule at 2:30 p.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">3:00 p.m.</th><td><input data-save=\"cap_sched_1500\" aria-label=\"Capstone schedule at 3:00 p.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">3:30 p.m.</th><td><input data-save=\"cap_sched_1530\" aria-label=\"Capstone schedule at 3:30 p.m.\" placeholder=\"What happens in this block?\"></td></tr><tr><th scope=\"row\">4:00 p.m.</th><td><input data-save=\"cap_sched_1600\" aria-label=\"Capstone schedule at 4:00 p.m.\" placeholder=\"What happens in this block?\"></td></tr></tbody></table></div>\n  <div class=\"twoCols\" style=\"margin-top:16px\">\n    <div class=\"fieldCard\"><h4>What did you deliberately leave out, move, or shorten?</h4><textarea data-save=\"cap_build_tradeoffs\"></textarea></div>\n    <div class=\"fieldCard\"><h4>What did you protect?</h4><textarea data-save=\"cap_build_protect\"></textarea></div>\n  </div>\n</section>\n\n<section class=\"card\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Capstone \u00b7 Step 3</div><h3>Handle the Difficult Conversation</h3><p>A new request conflicts with your plan. Prepare a response of no more than 30 seconds.</p></div><span class=\"badge\">10 MINUTES \u00b7 ROLE-PLAY</span></div>\n  <div class=\"threeCols\">\n    <div class=\"fieldCard\"><h4>1 \u00b7 Clarify</h4><p class=\"muted\">What exactly is needed, and by when?</p><textarea data-save=\"cap_talk_clarify\"></textarea></div>\n    <div class=\"fieldCard\"><h4>2 \u00b7 Tradeoff</h4><p class=\"muted\">What conflicts, and what are the options?</p><textarea data-save=\"cap_talk_tradeoff\"></textarea></div>\n    <div class=\"fieldCard\"><h4>3 \u00b7 Confirm</h4><p class=\"muted\">What did we decide, and what happens next?</p><textarea data-save=\"cap_talk_confirm\"></textarea></div>\n  </div>\n  <div class=\"partner\"><label>30-second spoken response</label><textarea data-save=\"cap_talk_script\" placeholder=\"Draft the response you will deliver aloud...\"></textarea></div>\n</section>\n\n<div id=\"actionplan\" class=\"sectionDivider\"><div class=\"kicker\">Action plan</div><h2>Turn the Course into Your Next Move</h2><p>Return to the challenge you wrote at the start and choose three observable actions.</p></div>\n\n<section class=\"card\" id=\"act12\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Personal action plan</div><h3>Choose Your Three</h3><p>Review your opening challenge, then choose one Start, one Stop or Reduce, and one Continue or Strengthen.</p></div><span class=\"badge\">7 MINUTES</span></div>\n  <div class=\"info\"><strong>Your opening challenge:</strong> <span id=\"challengeMirror\">Your response will appear here.</span></div>\n  <div class=\"actionGrid\">\n    <div class=\"actionCard\"><h4>Start</h4><textarea data-save=\"action_start\" placeholder=\"One specific, observable strategy to start...\"></textarea></div>\n    <div class=\"actionCard\"><h4>Stop or Reduce</h4><textarea data-save=\"action_stop\" placeholder=\"One habit or practice to stop or reduce...\"></textarea></div>\n    <div class=\"actionCard\"><h4>Continue or Strengthen</h4><textarea data-save=\"action_continue\" placeholder=\"One practice worth keeping or strengthening...\"></textarea></div>\n  </div>\n</section>\n\n<section class=\"card\" id=\"act13\">\n  <div class=\"sectionhead\"><div><div class=\"kicker\">Commitment</div><h3>Commit to the First Step</h3><p>Identify one action you will take within the next 24 hours, then schedule it in your preferred system.</p></div><span class=\"badge\">4 MINUTES</span></div>\n  <div class=\"twoCols\">\n    <div class=\"fieldCard\"><h4>My first action</h4><textarea data-save=\"first_action\" placeholder=\"What exactly will you do?\"></textarea></div>\n    <div class=\"fieldCard\"><h4>When I will do it</h4><label>Date / day<input data-save=\"first_day\" placeholder=\"Day or date...\"></label><label style=\"display:block;margin-top:10px\">Time<input type=\"time\" data-save=\"first_time\"></label></div>\n  </div>\n  <div class=\"partner\"><label class=\"choice\"><input type=\"checkbox\" data-save=\"first_scheduled\" value=\"yes\"> I scheduled this action in my calendar, planner, phone, or task system.</label></div>\n</section>\n\n<div class=\"toolbar\">\n  <span class=\"status\" id=\"saveStatus\">Saved locally</span>\n  <button class=\"btnAlt\" id=\"downloadBtn\" type=\"button\">Download My Work</button>\n  <button class=\"btnAlt\" id=\"resetBtn\" type=\"button\">Clear Workbook</button>\n  <button class=\"btnPrimary\" type=\"button\" onclick=\"window.print()\">Print / Save PDF</button>\n</div>\n\n<div class=\"footer\"><img alt=\"C\u00b2 Technologies\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJMAAACTCAYAAACK5SsVAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFxEAABcRAcom8z8AADP+SURBVHhe7X0HeF3Vle68eW/ee5leMsnLBIwNptn00GvoAUJCSyEhIckkQBopJMwEkpAEbEuW3AuuuBewjU1zU+/FkqxeLNmyJVm9d9179vrf9++zj3R15HIl3SvLttb3rU8uV+ees/d/1lp71b/6q/OEAPw1gP8lIp8C8G8ALhaRm0TkSyLyLRH5iYj8l1LqLaXUXKXUUqXUKqXUGsPvKKVWKqWWKKXmKKX+IiK/AfCCiHwdwAMicr2IXATgn0Xk//D7+L3ue5mgs4QA/A8fJoD+xmzuFBG5UUQetizruwBeEZFZBIiIbFdK7VNKJSilMpRSeSJSpJQ6pJQqdVhESpRS/PdcpdQBpVScUmqPUupdEXlbRN70eDy/FJFnReR+ANeJyIUi8g/mPng/+t7c9z1B45AA/G8R+YyITBORewB8zbKsl5VSIZQuIrLLgCCLYLEs67hSqkkp1amU6lNKeZVSglMQ/18p5VFK9SqlOpRSjUqpCqVUsVIqUykVrZTaISLLKcEsy3oJwBMicoeIXCYi/0qp5b73CTrDZN72vxeRz4vI1SLykIi8qJQKpcRQSiUqpcqUUs1m85WIOExyY2VEZK5F0tc21KOUajDSjADbQOkF4HsAvigiVwL4f0b1TkirM0EEkN val;\n    }\n    el.addEventListener('input',()=>{\n      if(el.type==='radio'){\n        if(el.checked) state.fields[key]=el.value;\n      } else if(el.type==='checkbox'){\n        state.fields[key]=el.checked;\n      } else {\n        state.fields[key]=el.value;\n      }\n      save();\n    });\n    el.addEventListener('change',()=>{\n      if(el.type==='radio'){\n        if(el.checked) state.fields[key]=el.value;\n      } else if(el.type==='checkbox'){\n        state.fields[key]=el.checked;\n      } else {\n        state.fields[key]=el.value;\n      }\n      save();\n    });\n  });\n}\n\nfunction updateMirrors(){\n  const m=document.getElementById('challengeMirror');\n  if(m){\n    const t=(state.fields.startChallenge||'').trim();\n    m.textContent=t || 'Your response will appear here.';\n  }\n}\n\nfunction updateCrowdTotal(){\n  let total=0;\n  document.querySelectorAll('.crowdDecision').forEach(sel=>{\n    if(sel.value==='fits') total += Number(sel.dataset.minutes||0);\n  });\n  const el=document.getElementById('crowdTotal');\n  if(el) el.textContent=total;\n}\n\nfunction updateProgress(){\n  const fields=[...document.querySelectorAll('[data-save]')];\n  let done=0,total=0;\n  const seen=new Set();\n  fields.forEach(el=>{\n    const key=el.dataset.save;\n    if(seen.has(key)) return;\n    seen.add(key); total++;\n    const v=state.fields[key];\n    if(v===true || (v!==undefined && String(v).trim()!=='')) done++;\n  });\n  const tasks=[\"m1t0\", \"m1t1\", \"m1t2\", \"m1t3\", \"m1t4\", \"m1t5\", \"m1t6\", \"m1t7\"];\n  tasks.forEach(id=>{ total++; if(state.taskZones[id] && state.taskZones[id]!=='Unsorted') done++; });\n  const pct=total?Math.round(done/total*100):0;\n  document.getElementById('progressText').textContent=pct+'%';\n  document.getElementById('progressBar').style.width=pct+'%';\n}\n\nconst announcer=document.getElementById('moveAnnouncement');\nfunction announce(msg){ if(!announcer)return; announcer.textContent=''; setTimeout(()=>announcer.textContent=msg,30); }\nfunction taskById(id){return document.querySelector('.task[data-task-id=\"'+id+'\"]');}\nfunction targetFor(zone){return zone==='Unsorted'?document.getElementById('taskBank'):document.querySelector('.zone[data-zone=\"'+zone+'\"]');}\nfunction moveTask(id,zone){\n  const task=taskById(id), target=targetFor(zone);\n  if(!task||!target)return;\n  target.appendChild(task);\n  state.taskZones[id]=zone;\n  save();\n  announce(task.querySelector('.taskLabel').textContent+' moved to '+(zone==='Unsorted'?'task bank':zone)+'.');\n}\ndocument.querySelectorAll('.task').forEach(task=>{\n  const id=task.dataset.taskId;\n  const zone=state.taskZones[id]||'Unsorted';\n  if(zone!=='Unsorted'){ const t=targetFor(zone); if(t)t.appendChild(task); }\n  task.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',id); e.dataTransfer.effectAllowed='move';});\n});\ndocument.querySelectorAll('.zone,#taskBank').forEach(z=>{\n  z.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});\n  z.addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');const zone=z.id==='taskBank'?'Unsorted':z.dataset.zone;moveTask(id,zone);});\n});\ndocument.querySelectorAll('.taskMoveBtn').forEach(btn=>{\n  btn.addEventListener('click',()=>{\n    const id=btn.dataset.task;\n    const sel=document.querySelector('.taskMoveSelect[data-task=\"'+id+'\"]');\n    if(!sel.value){announce('Choose a destination first.');return;}\n    moveTask(id,sel.value); sel.value='';\n  });\n});\n\nfunction downloadMyWork(){\n  const clone=document.documentElement.cloneNode(true);\n  clone.querySelectorAll('[data-save]').forEach(el=>{\n    const key=el.dataset.save;\n    const v=state.fields[key];\n    if(el.tagName==='TEXTAREA'){\n      el.textContent=(v===undefined?'':v);\n    } else if(el.tagName==='SELECT'){\n      [...el.options].forEach(o=>{if(o.value===v || o.text===v)o.setAttribute('selected','selected');else o.removeAttribute('selected');});\n    } else if(el.type==='radio'){\n      if(v===el.value) el.setAttribute('checked','checked'); else el.removeAttribute('checked');\n    } else if(el.type==='checkbox'){\n      if(v===true || v===el.value) el.setAttribute('checked','checked'); else el.removeAttribute('checked');\n    } else {\n      el.setAttribute('value',v===undefined?'':v);\n    }\n  });\n  clone.querySelectorAll('.task').forEach(t=>{\n    const id=t.dataset.taskId;\n    const zone=state.taskZones[id]||'Unsorted';\n    const target=zone==='Unsorted'?clone.querySelector('#taskBank'):clone.querySelector('.zone[data-zone=\"'+zone+'\"]');\n    if(target)target.appendChild(t);\n  });\n  const stateScript=clone.querySelector('script');\n  const doc='<!DOCTYPE html>\\n'+clone.outerHTML;\n  const blob=new Blob([doc],{type:'text/html'});\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(blob);\n  a.download='Time_Management_My_Work.html';\n  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n}\n\ndocument.getElementById('downloadBtn').addEventListener('click',downloadMyWork);\ndocument.getElementById('resetBtn').addEventListener('click',()=>{\n  if(confirm('Clear all workbook entries and activity responses?')){localStorage.removeItem(KEY);location.reload();}\n});\n\nconst links=[...document.querySelectorAll('.nav a')];\nconst sections=links.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);\nconst observer=new IntersectionObserver(entries=>{\n  entries.forEach(en=>{\n    if(en.isIntersecting){\n      const active=links.find(a=>document.querySelector(a.getAttribute('href'))===en.target);\n      if(!active)return;\n      links.forEach(a=>a.classList.remove('active','group-current'));\n      active.classList.add('active');\n      let g=active;while(g&&g.classList.contains('sub'))g=g.previousElementSibling;\n      if(g&&g!==active)g.classList.add('group-current');\n      const sb=document.querySelector('.sidebar'),r=active.getBoundingClientRect(),sr=sb.getBoundingClientRect();\n      if(r.top<sr.top+80||r.bottom>sr.bottom-40)sb.scrollTop+=r.top-sr.top-sr.height/3;\n    }\n  });\n},{rootMargin:'-32% 0px -58% 0px'});\nsections.forEach(s=>observer.observe(s));\n\nbindFields();\nupdateMirrors();\nupdateCrowdTotal();\nupdateProgress();\n</script>\n\n\n</body></html>"
